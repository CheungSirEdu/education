<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鄉村豐收圖">
<meta name="theme-color" content="#16110e">
<title>鄉村豐收圖</title>
<style>
  :root {
    --ink: #2a2118;
    --cream: #fff8ec;
    --red: #b42318;
    --red-dark: #8c1c14;
    --gold: #e7c27a;
    --line: #ead8b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; max-width: 100%; overscroll-behavior: none; }
  html { touch-action: manipulation; background: #16110e; }
  body {
    margin: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    font-family: "PingFang HK", "PingFang TC", "Heiti TC", "Noto Sans HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(1100px 520px at 50% 18%, #4e3d2c 0%, #2a211a 52%, #16110e 100%);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button, img { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .top {
    display: none;
    flex: 0 0 auto;
    align-items: center;
    gap: 10px;
    padding: max(8px, env(safe-area-inset-top)) 14px 8px;
    color: #fff6e6;
  }
  .seal {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    background: var(--red);
    display: grid;
    place-items: center;
    font-weight: 800;
    letter-spacing: 0;
    box-shadow: inset 0 0 0 2px rgba(255, 236, 210, .45);
  }
  .top h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .top p {
    margin: 1px 0 0;
    font-size: 13px;
    opacity: .85;
  }
  @media (max-width: 720px) {
    .top p { display: none; }
    .top h1 { font-size: 18px; }
  }
  .top .grow { flex: 1; }
  .ghost {
    border: 1px solid rgba(255, 236, 210, .45);
    background: transparent;
    color: #fff6e6;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 700;
    min-height: 40px;
  }
  .ghost[aria-pressed="true"] {
    background: rgba(255, 236, 210, .16);
  }

  .stage-wrap {
    flex: 0 0 auto;
    position: relative;
    z-index: 1;
    height: 220px;
    margin: 0 10px;
  }
  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 14px;
    background: #1a140f;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
    touch-action: none;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .stage.can-pan { cursor: grab; }
  .stage.dragging { cursor: grabbing; }
  .zoom {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  .zoom img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  .hotspot {
    position: absolute;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    border-radius: 12px;
    box-shadow: inset 0 0 0 2px rgba(255, 248, 236, .55);
    cursor: pointer;
  }
  .hotspot:focus-visible {
    outline: 3px solid #ffe08a;
    outline-offset: 2px;
  }
  .hotspot:hover,
  .hotspot:focus-visible,
  .hotspot:active {
    background: rgba(255, 214, 120, .22);
  }
  .tag {
    position: absolute;
    transform: translate(0, 0);
    background: var(--red);
    color: white;
    font-weight: 800;
    font-size: var(--tag-size, 22px);
    line-height: 1;
    padding: 0.45em 0.75em;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    white-space: nowrap;
    pointer-events: none;
  }
  .tag.edge { transform: translate(-100%, 0); }
  .stage.is-detail .hotspot { display: none; }
  .pick-hint {
    position: fixed;
    z-index: 25;
    left: 0;
    right: 0;
    bottom: max(18px, env(safe-area-inset-bottom));
    width: max-content;
    max-width: min(960px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 14px 26px;
    border-radius: 16px;
    background: rgba(22, 17, 14, .78);
    color: #fff6e6;
    font-size: clamp(26px, 2.8vw, 56px);
    font-weight: 800;
    line-height: 1.4;
    text-align: center;
    text-wrap: balance;
    pointer-events: none;
  }
  body.is-detail .pick-hint { display: none; }
  @media (max-width: 900px) {
    body.is-fill.is-overview .pick-hint {
      bottom: calc(96px + env(safe-area-inset-bottom));
    }
  }

  .pan {
    position: absolute;
    top: 50%;
    z-index: 3;
    transform: translateY(-50%);
    width: 72px;
    height: 96px;
    border: 0;
    border-radius: 16px;
    background: rgba(28, 18, 12, .62);
    color: white;
    font-size: 26px;
    font-weight: 800;
    display: none;
  }
  .pan.show { display: grid; place-items: center; }
  .pan.left { left: 8px; }
  .pan.right { right: 8px; }
  .pan:active { background: rgba(180, 35, 24, .9); }

  body.is-overview .panel { display: none; }
  body.is-overview .stage-wrap {
    margin: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  :fullscreen body.is-overview .stage-wrap,
  :-webkit-full-screen body.is-overview .stage-wrap,
  body.is-fill.is-overview .stage-wrap { margin: 0; }
  :fullscreen .stage,
  :-webkit-full-screen .stage,
  body.is-fill .stage { border-radius: 0; box-shadow: none; }
  body.is-fill {
    position: fixed;
    margin: 0;
    overflow: hidden;
    top: 0;
    left: 0;
    width: 100%;
    height: 100dvh;
    touch-action: none;
  }
  html.is-bar-hide,
  html.is-bar-hide body {
    max-height: none;
  }
  .panel {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    overflow: auto;
    margin: 8px 10px max(8px, env(safe-area-inset-bottom));
    padding: 12px 14px 12px;
    background: var(--cream);
    border-radius: 18px;
    box-shadow: inset 0 0 0 1px var(--line), 0 8px 20px rgba(0, 0, 0, .18);
    -webkit-overflow-scrolling: touch;
  }
  .chips,
  #speak-btn,
  .hint,
  .voice-hint { display: none; }
  .chips {
    display: none;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    min-width: 0;
  }
  @media (min-width: 900px) {
    .chips { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  .chip {
    min-width: 0;
    border: 1px solid #e4d0b0;
    background: white;
    color: var(--ink);
    border-radius: 999px;
    min-height: 44px;
    padding: 8px 12px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
  }
  .chip[aria-pressed="true"] {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .panel h2 {
    order: 1;
    margin: 0 0 6px;
    font-size: clamp(28px, 2.8vw, 56px);
    line-height: 1.25;
  }
  .story { order: 2; }
  .hint { order: 5; }
  .voice-hint { order: 6; }
  .story span {
    display: block;
    font-size: clamp(22px, 2.1vw, 46px);
    line-height: 1.65;
    margin: 0 0 2px;
  }
  .hint {
    margin: 6px 0 0;
    color: #7a6248;
    font-size: 15px;
  }
  .voice-hint {
    margin: 6px 0 0;
    color: var(--red-dark);
    font-size: 14px;
    line-height: 1.45;
  }
  .voice-hint:empty { display: none; }
  .actions {
    order: 3;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 4px;
  }
  .actions button {
    min-height: 64px;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: clamp(22px, 1.8vw, 34px);
    font-weight: 800;
    border: 1px solid #e4d0b0;
    background: white;
    color: var(--ink);
  }
  .actions .primary {
    background: var(--red);
    border-color: var(--red);
    color: white;
    flex: 1 1 140px;
  }
  .actions .primary:active { background: var(--red-dark); }
  .actions .back {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .actions .back:active { background: var(--red-dark); }
  .actions button[hidden] { display: none; }

  .full-btn {
    position: fixed;
    z-index: 30;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    min-width: 112px;
    min-height: 64px;
    padding: 12px 18px;
    border: 0;
    border-radius: 16px;
    background: rgba(28, 18, 12, .78);
    color: #fff6e6;
    font-size: 24px;
    font-weight: 800;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
  }
  .full-btn[aria-pressed="true"] {
    opacity: .45;
    min-width: 84px;
    min-height: 52px;
    font-size: 18px;
  }
  .full-btn:active { background: var(--red); opacity: 1; }
  @media (max-width: 900px) {
    .full-btn {
      position: relative;
      top: auto;
      right: auto;
      left: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: calc(100% - 24px);
      margin: 12px auto max(12px, env(safe-area-inset-bottom));
      min-width: 0;
      min-height: 72px;
      padding: 14px 18px;
      background: var(--red);
      color: white;
      font-size: 28px;
      opacity: 1;
    }
    .full-btn[aria-pressed="true"] {
      opacity: 1;
      min-width: 0;
      min-height: 64px;
      font-size: 24px;
      background: var(--red-dark);
    }
    body.is-fill .full-btn,
    body.is-detail .full-btn,
    :fullscreen .full-btn,
    :-webkit-full-screen .full-btn {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      width: auto;
      margin: 0;
      z-index: 40;
    }
    body.is-fill .full-btn {
      position: fixed;
      z-index: 80;
    }
  }

  @media (orientation: landscape) and (max-height: 520px) {
    .panel { max-height: 44dvh; }
    .top h1 { font-size: 17px; }
    .seal { width: 30px; height: 30px; }
    .story span { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .zoom { transition: none !important; }
  }
</style>
</head>
<body class="is-overview">
  <header class="top">
    <div class="seal" aria-hidden="true">鄉</div>
    <div>
      <h1>鄉村豐收圖</h1>
      <p>撳一個地方，放大睇，再聽故事</p>
    </div>
    <div class="grow"></div>
    <button type="button" class="ghost" id="auto-btn" aria-pressed="true">自動讀開</button>
  </header>

  <div class="stage-wrap" id="stage-wrap">
    <div class="stage" id="stage">
      <div class="zoom" id="zoom">
        <img src="painting.jpg" alt="一幅彩色的鄉村圖，畫有春耕、插秧、風車、牧鵝、放炮仗、舞獅紙鷂和藍印花布" draggable="false">
      </div>
      <button type="button" class="pan left" id="pan-left" aria-label="向左睇">左</button>
      <button type="button" class="pan right" id="pan-right" aria-label="向右睇">右</button>
    </div>
  </div>

  <section class="panel" id="panel" aria-live="polite">
    <div class="chips" id="chips"></div>
    <h2 id="title">揀一個地方</h2>
    <div class="story" id="story"></div>
    <p class="hint" id="hint"></p>
    <p class="voice-hint" id="voice-hint"></p>
    <div class="actions">
      <button type="button" class="primary" id="speak-btn" hidden>讀出嚟</button>
      <button type="button" id="zoom-in">放大</button>
      <button type="button" id="zoom-out">縮細</button>
      <button type="button" class="back" id="back-btn" hidden>返回全圖</button>
    </div>
  </section>
  <p class="pick-hint" id="pick-hint">請選擇有關中華文化的生活細節。</p>
  <button type="button" class="full-btn" id="full-btn" aria-pressed="false">全螢幕</button>

<script>
/*
  七個部份：春耕、插秧、風車車水、牧鵝、放炮仗、舞獅紙鷂、藍印花布。
  藍印花布放最後，範圍細，先會蓋住草地同村屋重疊嘅一忽。
  第一版唔顯示紅色名牌，左下角先有選擇提示。
  加一個部份就抄一段，改 id、name、x、y、w、h 同 lines。
  x y w h 係成幅畫嘅百分比，左上角係 0, 0。
  tagX tagY 係個紅色名牌嘅位置。
*/
const REGIONS = [
  {
    id: "ox",
    name: "春耕",
    x: 0, y: 3, w: 38, h: 36,
    tagX: 2, tagY: 6,
    lines: [
      "左上角是一片藍色的水田，農夫正在春耕。",
      "他們戴着斗笠，有人耕作，有人趕着黑牛把泥土翻開。",
      "牛耕是中華農耕的傳統，翻好的田才可以種稻。",
      "稻米是中國人世代相傳的主要糧食。"
    ]
  },
  {
    id: "fields",
    name: "插秧",
    x: 38, y: 4, w: 39, h: 28,
    tagX: 52, tagY: 7,
    lines: [
      "上面這一片金黃色的地方，就是稻田。",
      "農夫彎着腰插秧、除草，把秧苗一棵一棵插進田裡。",
      "插秧是中國種稻的重要工序，之後才有稻米收成。",
      "田邊有一個水塘，白鴨在游水，還有一艘小船。"
    ]
  },
  {
    id: "windmill",
    name: "風車車水",
    x: 77, y: 2, w: 23, h: 30,
    tagX: 98, tagY: 16,
    lines: [
      "右上角有一座黑白色的大風車，立在稻田旁邊。",
      "風一吹，葉片便轉動，幫助農夫車水灌田。",
      "這是中國農村傳統的水利方法，田裡有水，才可以種米。",
      "風車下面有人坐着船，抱着一隻白鵝。"
    ]
  },
  {
    id: "river",
    name: "牧鵝",
    x: 0, y: 40, w: 32, h: 26,
    tagX: 2, tagY: 43,
    lines: [
      "左邊有一條河，許多白鵝排着隊在水裡游泳。",
      "有人趕着小鵝，走過紅色的橋。",
      "養鵝、牧鵝是中國農村常見的傳統。",
      "村屋就建在河邊，人和鵝都靠這條河生活。"
    ]
  },
  {
    id: "houses",
    name: "放炮仗",
    x: 64, y: 31, w: 36, h: 33,
    tagX: 72, tagY: 36,
    lines: [
      "放炮仗是中華文化裡重要的習俗。",
      "春節、結婚、新店開張，還有豐收的日子，人們都會放炮仗。",
      "炮仗又響又亮，用來熱烈祝賀，也有驅邪迎祥的意思。",
      "村屋掛着紅燈籠，大家站在騎樓和窗口，看着滿地火花。"
    ]
  },
  {
    id: "grass",
    name: "舞獅紙鷂",
    x: 0, y: 62, w: 100, h: 38,
    tagX: 40, tagY: 66,
    lines: [
      "下面的草地上，大家正在玩中華傳統的遊藝。",
      "中間有人舞獅，周圍的人拿着扇子觀看。舞獅用來賀歲和慶祝節日。",
      "小朋友放着紙鷂，有燕子形狀的。紙鷂又叫風箏，是中國古老的手藝。",
      "右邊有兩隊人在拔河，左邊有人用扁擔挑着籃子。"
    ]
  },
  {
    id: "laundry",
    name: "藍印花布",
    x: 32, y: 33, w: 33, h: 27,
    tagX: 35, tagY: 36,
    lines: [
      "竹竿上晾着深藍色的花布，也有紅色的衣服。",
      "這種藍白花布叫藍印花布，是中國傳統的手工布料。",
      "人們用它做衣服、頭巾和門簾，花紋多是花草和點子。",
      "屋子前面有一位小朋友坐在白色長凳上，旁邊有一隻帶黑斑的白狗。"
    ]
  }
];

const INTRO = {
  title: "揀一個地方",
  lines: [
    "呢幅畫住咗一條村。",
    "撳紅色嘅名，就可以放大睇。",
    "下面有字，部機亦都會用廣東話讀出嚟。"
  ],
  hint: "請選擇有關中華文化的生活細節。"
};

const ASPECT = 2000 / 1189;
const MAX_SCALE = 6;

const stage = document.getElementById("stage");
const zoom = document.getElementById("zoom");
const titleEl = document.getElementById("title");
const storyEl = document.getElementById("story");
const hintEl = document.getElementById("hint");
const voiceHint = document.getElementById("voice-hint");
const speakBtn = document.getElementById("speak-btn");
const backBtn = document.getElementById("back-btn");
const zoomInBtn = document.getElementById("zoom-in");
const zoomOutBtn = document.getElementById("zoom-out");
const autoBtn = document.getElementById("auto-btn");
const panLeft = document.getElementById("pan-left");
const panRight = document.getElementById("pan-right");
const chips = document.getElementById("chips");

let baseW = 1;
let baseH = 1;
let stageW = 1;
let stageH = 1;
let px = 0;
let py = 0;
let scale = 1;
let current = null;
let autoSpeak = sessionStorage.getItem("village-auto-speak") !== "0";
let speaking = false;
let speakToken = 0;
let drag = null;
let fillMode = false;
let fillTimer = 0;
let lastPin = "";

function markMode() {
  document.body.classList.toggle("is-overview", !current);
  document.body.classList.toggle("is-detail", !!current);
}

function resizeWrap() {
  const wrap = document.getElementById("stage-wrap");
  const viewH = viewHeight();
  const phoneFill = fillMode && !nativeFullscreen() && window.matchMedia("(max-width: 900px)").matches;
  const chromeH = phoneFill ? 88 : 0;
  const avail = Math.max(220, viewH - 16 - chromeH);
  let h;
  if (!current) {
    if (isFullscreen()) {
      h = Math.max(160, viewH - chromeH);
    } else {
      const stageWGuess = Math.max(280, window.innerWidth - 36);
      const imageH = stageWGuess / ASPECT;
      h = imageH < avail * 0.72 ? Math.max(200, imageH) : avail;
    }
  } else {
    const minPanel = Math.max(220, Math.min(560, avail * 0.4));
    h = Math.max(160, avail - minPanel);
  }
  wrap.style.height = Math.round(h) + "px";
}

function layout(animate) {
  resizeWrap();
  const rect = stage.getBoundingClientRect();
  stageW = Math.max(1, rect.width);
  stageH = Math.max(1, rect.height);
  const stageAspect = stageW / stageH;
  if (stageAspect > ASPECT) {
    baseH = stageH;
    baseW = stageH * ASPECT;
  } else {
    baseW = stageW;
    baseH = stageW / ASPECT;
  }
  zoom.style.width = baseW + "px";
  zoom.style.height = baseH + "px";
  zoom.style.transition = animate ? "transform .55s cubic-bezier(.22,.8,.24,1)" : "none";
  if (current) {
    centerOn(current, animate ? fitScale(current) : Math.max(scale, 1));
  } else {
    scale = 1;
    px = (stageW - baseW) / 2;
    py = (stageH - baseH) / 2;
  }
  apply();
  updatePans();
}

function apply() {
  zoom.style.transform = "translate(" + px + "px," + py + "px) scale(" + scale + ")";
}

function fitScale(region) {
  const fitW = stageW / ((region.w / 100) * baseW);
  const fitH = stageH / ((region.h / 100) * baseH);
  const contain = Math.min(fitW, fitH);
  const cover = Math.max(fitW, fitH);
  // 個部份已經好大，就成個睇到。太闊嘅部份就鋪滿畫面，左右撥。
  const s = contain >= 2.2 ? contain : cover;
  return Math.max(1, Math.min(MAX_SCALE, s));
}

function regionBounds(region) {
  const padX = baseW * 0.015;
  const padY = baseH * 0.015;
  return {
    left: Math.max(0, (region.x / 100) * baseW - padX),
    right: Math.min(baseW, ((region.x + region.w) / 100) * baseW + padX),
    top: Math.max(0, (region.y / 100) * baseH - padY),
    bottom: Math.min(baseH, ((region.y + region.h) / 100) * baseH + padY)
  };
}

function clampAxis(pos, view, start, end, s) {
  const shown = view / s;
  const size = end - start;
  if (shown >= size) {
    const mid = (start + end) / 2;
    return view / 2 - mid * s;
  }
  const maxPos = -start * s;
  const minPos = view - end * s;
  return Math.min(maxPos, Math.max(minPos, pos));
}

function clamp() {
  if (!current) {
    px = (stageW - baseW * scale) / 2;
    py = (stageH - baseH * scale) / 2;
    if (baseW * scale <= stageW) px = (stageW - baseW * scale) / 2;
    else px = Math.min(0, Math.max(stageW - baseW * scale, px));
    if (baseH * scale <= stageH) py = (stageH - baseH * scale) / 2;
    else py = Math.min(0, Math.max(stageH - baseH * scale, py));
    return;
  }
  const b = regionBounds(current);
  px = clampAxis(px, stageW, b.left, b.right, scale);
  py = clampAxis(py, stageH, b.top, b.bottom, scale);
}

function centerOn(region, s) {
  const cx = ((region.x + region.w / 2) / 100) * baseW;
  const cy = ((region.y + region.h / 2) / 100) * baseH;
  scale = s;
  px = stageW / 2 - cx * scale;
  py = stageH / 2 - cy * scale;
  clamp();
}

function updatePans() {
  if (!current) {
    panLeft.classList.remove("show");
    panRight.classList.remove("show");
    stage.classList.remove("can-pan");
    return;
  }
  const b = regionBounds(current);
  const minPx = clampAxis(-1e9, stageW, b.left, b.right, scale);
  const maxPx = clampAxis(1e9, stageW, b.left, b.right, scale);
  const room = maxPx - minPx > 24;
  panLeft.classList.toggle("show", room && px < maxPx - 12);
  panRight.classList.toggle("show", room && px > minPx + 12);
  stage.classList.toggle("can-pan", room);
}

function setText(item) {
  titleEl.textContent = item.title || item.name;
  storyEl.replaceChildren();
  item.lines.forEach(function (line) {
    const span = document.createElement("span");
    span.textContent = line;
    storyEl.appendChild(span);
  });
  hintEl.textContent = item.hint || "";
}

function renderChips() {
  chips.replaceChildren();
  REGIONS.forEach(function (region) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.textContent = region.name;
    btn.setAttribute("aria-pressed", current && current.id === region.id ? "true" : "false");
    btn.addEventListener("click", function () { openRegion(region, true); });
    chips.appendChild(btn);
  });
}

function renderHotspots() {
  REGIONS.forEach(function (region) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hotspot";
    btn.dataset.id = region.id;
    btn.style.left = region.x + "%";
    btn.style.top = region.y + "%";
    btn.style.width = region.w + "%";
    btn.style.height = region.h + "%";
    btn.setAttribute("aria-label", "睇" + region.name);
    btn.addEventListener("click", function (event) {
      event.stopPropagation();
      enterFullscreen();
      openRegion(region, true);
    });
    zoom.appendChild(btn);
  });
}

function openRegion(region, withSpeech) {
  current = region;
  markMode();
  stage.classList.add("is-detail");
  backBtn.hidden = false;
  zoomInBtn.hidden = false;
  zoomOutBtn.hidden = false;
  layout(true);
  setText({
    name: region.name,
    lines: region.lines
  });
  renderChips();
  if (withSpeech) speak(region.lines);
  else stopSpeak();
}

function panHint(region) {
  const s = fitScale(region);
  const b = {
    left: (region.x / 100) * baseW,
    right: ((region.x + region.w) / 100) * baseW
  };
  const shown = stageW / s;
  if (b.right - b.left > shown + 20) return "用手指左右撥，或者撳左、右，可以睇晒呢度。";
  return "可以再撳放大，睇清楚啲。";
}

function showOverview(withMotion) {
  stopSpeak();
  current = null;
  markMode();
  stage.classList.remove("is-detail");
  backBtn.hidden = true;
  zoomInBtn.hidden = true;
  zoomOutBtn.hidden = true;
  layout(withMotion);
  setText({ title: "", lines: [] });
  renderChips();
}

function zoomBy(factor, clientX, clientY) {
  if (!current) return;
  const rect = stage.getBoundingClientRect();
  const localX = (clientX == null ? rect.left + stageW / 2 : clientX) - rect.left;
  const localY = (clientY == null ? rect.top + stageH / 2 : clientY) - rect.top;
  const ix = (localX - px) / scale;
  const iy = (localY - py) / scale;
  const fit = fitScale(current);
  const next = Math.max(fit * 0.98, Math.min(MAX_SCALE, scale * factor));
  scale = next;
  px = localX - ix * scale;
  py = localY - iy * scale;
  clamp();
  zoom.style.transition = "transform .25s ease";
  apply();
  updatePans();
}

function panBy(dx) {
  if (!current) return;
  px += dx;
  clamp();
  zoom.style.transition = "transform .35s ease";
  apply();
  updatePans();
}

function pickVoice() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  let best = null;
  let bestScore = 0;
  voices.forEach(function (voice) {
    const name = (voice.name + " " + voice.lang).toLowerCase();
    let score = 0;
    if (/zh[-_]hk|yue/.test(name)) score += 5;
    if (/sinji|sin-ji|善怡/.test(name)) score += 8;
    if (/cantonese|粵語|廣東話/.test(name)) score += 6;
    if (/hong kong/.test(name)) score += 4;
    if (score > bestScore) {
      best = voice;
      bestScore = score;
    }
  });
  return bestScore > 0 ? best : null;
}

function refreshVoiceHint() {
  if (!window.speechSynthesis) {
    voiceHint.textContent = "呢個瀏覽器讀唔到聲，文字仍然睇到。";
    return;
  }
  const voices = window.speechSynthesis.getVoices();
  if (pickVoice()) {
    voiceHint.textContent = "";
    return;
  }
  if (!voices.length) return;
  voiceHint.textContent = "呢部機未見粵語聲音。iPad：設定 → 輔助使用 → 語音內容 → 聲音 → 中文，下載粵語。";
}

function stopSpeak() {
  speakToken += 1;
  speaking = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function speak(lines) {
  if (!window.speechSynthesis) return;
  stopSpeak();
  const token = speakToken;
  const queue = lines.slice();
  speaking = true;
  const backup = setTimeout(function () {
    if (token !== speakToken) return;
    showOverview(true);
  }, 3000 + lines.join("").length * 450);
  const step = function () {
    if (token !== speakToken) return;
    if (!queue.length) {
      clearTimeout(backup);
      speaking = false;
      setTimeout(function () {
        if (token !== speakToken) return;
        showOverview(true);
      }, 700);
      return;
    }
    const utter = new SpeechSynthesisUtterance(queue.shift());
    utter.lang = "zh-HK";
    utter.rate = 0.9;
    const voice = pickVoice();
    if (voice) utter.voice = voice;
    utter.onend = function () { step(); };
    utter.onerror = function () {
      speaking = false;
    };
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(utter);
  };
  window.speechSynthesis.resume();
  step();
}

function syncAuto() {
  autoBtn.textContent = autoSpeak ? "自動讀開" : "自動讀關";
  autoBtn.setAttribute("aria-pressed", autoSpeak ? "true" : "false");
}

autoBtn.addEventListener("click", function () {
  autoSpeak = !autoSpeak;
  sessionStorage.setItem("village-auto-speak", autoSpeak ? "1" : "0");
  syncAuto();
  if (!autoSpeak) stopSpeak();
});

speakBtn.addEventListener("click", function () {
  if (speaking) {
    stopSpeak();
    return;
  }
  const lines = current ? current.lines : INTRO.lines;
  speak(lines);
});

backBtn.addEventListener("click", function () { showOverview(true); });
zoomInBtn.addEventListener("click", function () { zoomBy(1.25); });
zoomOutBtn.addEventListener("click", function () { zoomBy(0.8); });
panLeft.addEventListener("click", function (event) {
  event.stopPropagation();
  panBy(stageW * 0.62);
});
panRight.addEventListener("click", function (event) {
  event.stopPropagation();
  panBy(-stageW * 0.62);
});

stage.addEventListener("pointerdown", function (event) {
  if (event.target.closest(".hotspot") || event.target.closest(".pan")) return;
  if (!current) return;
  drag = {
    id: event.pointerId,
    x: event.clientX,
    y: event.clientY,
    px: px,
    py: py,
    moved: false,
    pointers: new Map()
  };
  stage.setPointerCapture(event.pointerId);
  stage.classList.add("dragging");
  zoom.style.transition = "none";
});

const pinches = new Map();
stage.addEventListener("pointerdown", function (event) {
  pinches.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pinches.size === 2 && current) {
    const pair = Array.from(pinches.values());
    drag = {
      pinch: true,
      dist: Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y) || 1,
      s: scale,
      px: px,
      py: py,
      midX: (pair[0].x + pair[1].x) / 2,
      midY: (pair[0].y + pair[1].y) / 2
    };
    zoom.style.transition = "none";
  }
});
stage.addEventListener("pointermove", function (event) {
  if (pinches.has(event.pointerId)) {
    pinches.set(event.pointerId, { x: event.clientX, y: event.clientY });
  }
  if (drag && drag.pinch && pinches.size >= 2 && current) {
    const pair = Array.from(pinches.values());
    const dist = Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y) || 1;
    const rect = stage.getBoundingClientRect();
    const localX = drag.midX - rect.left;
    const localY = drag.midY - rect.top;
    const ix = (localX - drag.px) / drag.s;
    const iy = (localY - drag.py) / drag.s;
    const fit = fitScale(current);
    scale = Math.max(fit * 0.98, Math.min(MAX_SCALE, drag.s * (dist / drag.dist)));
    px = localX - ix * scale;
    py = localY - iy * scale;
    clamp();
    apply();
    updatePans();
    return;
  }
  if (!drag || drag.pinch || drag.id !== event.pointerId) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (Math.hypot(dx, dy) > 6) drag.moved = true;
  px = drag.px + dx;
  py = drag.py + dy;
  clamp();
  apply();
});
function endPointer(event) {
  pinches.delete(event.pointerId);
  if (drag && drag.id === event.pointerId && !drag.pinch) {
    drag = null;
    stage.classList.remove("dragging");
    updatePans();
  }
  if (pinches.size < 2 && drag && drag.pinch) {
    drag = null;
    updatePans();
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

stage.addEventListener("wheel", function (event) {
  if (!current) return;
  event.preventDefault();
  zoomBy(event.deltaY < 0 ? 1.08 : 0.92, event.clientX, event.clientY);
}, { passive: false });

stage.addEventListener("click", function (event) {
  if (event.target.closest(".hotspot") || event.target.closest(".pan")) return;
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") showOverview(true);
  if (!current) {
    const n = Number(event.key);
    if (n >= 1 && n <= REGIONS.length) openRegion(REGIONS[n - 1], true);
    return;
  }
  if (event.key === "ArrowLeft") panBy(stageW * 0.25);
  if (event.key === "ArrowRight") panBy(-stageW * 0.25);
  if (event.key === "ArrowUp") { py += stageH * 0.2; clamp(); apply(); }
  if (event.key === "ArrowDown") { py -= stageH * 0.2; clamp(); apply(); }
  if (event.key === "+" || event.key === "=") zoomBy(1.2);
  if (event.key === "-" || event.key === "_") zoomBy(0.84);
});

if (window.speechSynthesis) {
  window.speechSynthesis.addEventListener("voiceschanged", refreshVoiceHint);
  refreshVoiceHint();
  window.setInterval(function () {
    if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
  }, 4000);
}

function nativeFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function isFullscreen() {
  return nativeFullscreen() || fillMode;
}

function viewHeight() {
  if (fillMode && !nativeFullscreen()) {
    const pinned = parseFloat(document.body.style.height);
    if (pinned > 0) return pinned;
    if (window.visualViewport) return Math.round(window.visualViewport.height);
  }
  return window.innerHeight;
}

function touchScreen() {
  const coarse = window.matchMedia("(pointer: coarse)").matches;
  const shortSide = Math.min(window.screen.width || 9999, window.screen.height || 9999);
  return coarse && shortSide <= 1200;
}

function alreadyStandalone() {
  return window.navigator.standalone === true
    || window.matchMedia("(display-mode: standalone)").matches
    || window.matchMedia("(display-mode: fullscreen)").matches;
}

function clearPin() {
  if (fillTimer) {
    window.clearTimeout(fillTimer);
    fillTimer = 0;
  }
  const html = document.documentElement;
  html.classList.remove("is-bar-hide");
  html.style.height = "";
  html.style.overflow = "";
  document.body.style.overflow = "";
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.width = "";
  document.body.style.height = "";
  lastPin = "";
  clearFullBtnStyle();
  try { window.scrollTo(0, 0); } catch (err) {}
}

function pinFill() {
  if (!fillMode || nativeFullscreen()) return;
  const vv = window.visualViewport;
  const top = Math.round(vv ? vv.offsetTop : 0);
  const left = Math.round(vv ? vv.offsetLeft : 0);
  const width = Math.round(vv ? vv.width : window.innerWidth);
  const height = Math.round(vv ? vv.height : window.innerHeight);
  const key = top + "," + left + "," + width + "," + height;
  document.body.style.top = top + "px";
  document.body.style.left = left + "px";
  document.body.style.width = width + "px";
  document.body.style.height = height + "px";
  placeFullBtn(top, left, width, height);
  if (key === lastPin) return;
  lastPin = key;
  layout(false);
}

function placeFullBtn(top, left, width, height) {
  if (!window.matchMedia("(max-width: 900px)").matches) return;
  const btnH = 64;
  const gap = alreadyStandalone() ? 36 : 12;
  fullBtn.style.position = "fixed";
  fullBtn.style.zIndex = "80";
  fullBtn.style.top = Math.round(top + height - btnH - gap) + "px";
  fullBtn.style.bottom = "auto";
  fullBtn.style.left = Math.round(left + 12) + "px";
  fullBtn.style.right = "auto";
  fullBtn.style.width = Math.max(120, Math.round(width - 24)) + "px";
  fullBtn.style.margin = "0";
}

function clearFullBtnStyle() {
  fullBtn.style.position = "";
  fullBtn.style.zIndex = "";
  fullBtn.style.top = "";
  fullBtn.style.bottom = "";
  fullBtn.style.left = "";
  fullBtn.style.right = "";
  fullBtn.style.width = "";
  fullBtn.style.margin = "";
}

function setFillMode(on) {
  fillMode = on;
  document.body.classList.toggle("is-fill", on);
  if (!on) clearPin();
  syncFullBtn();
  if (on) pinFill();
  else layout(false);
}

// iPhone Safari 收唔到個時鐘。先將頁面捲低，等下面條工具列收起，再將畫面鎖喺睇到嗰一截。
function collapseThenPin() {
  if (fillTimer || fillMode || nativeFullscreen()) return;
  if (alreadyStandalone()) {
    setFillMode(true);
    return;
  }
  const html = document.documentElement;
  const body = document.body;
  const extra = Math.round(Math.max(window.screen.height || 0, window.innerHeight) + 180);
  html.classList.add("is-bar-hide");
  html.style.overflow = "auto";
  html.style.height = extra + "px";
  body.style.position = "relative";
  body.style.overflow = "visible";
  body.style.height = extra + "px";
  void body.offsetHeight;
  try { window.scrollTo(0, 100); } catch (err) {}
  fillTimer = window.setTimeout(function () {
    fillTimer = 0;
    html.classList.remove("is-bar-hide");
    body.style.overflow = "";
    body.style.position = "";
    body.style.height = "";
    if (nativeFullscreen()) {
      html.style.height = "";
      html.style.overflow = "";
      try { window.scrollTo(0, 0); } catch (err) {}
      syncFullBtn();
      return;
    }
    setFillMode(true);
  }, 360);
  syncFullBtn();
}

function enterFullscreen() {
  if (isFullscreen() || fillTimer) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  let settled = false;
  function fallback() {
    if (settled || nativeFullscreen() || fillMode) return;
    settled = true;
    if (touchScreen()) collapseThenPin();
    else setFillMode(true);
  }
  if (!req) {
    fallback();
    return;
  }
  try {
    let result;
    try {
      result = req.call(el, { navigationUI: "hide" });
    } catch (err) {
      result = req.call(el);
    }
    if (result && result.then) {
      result.then(function () {
        settled = true;
        if (fillMode) setFillMode(false);
      }, fallback);
      window.setTimeout(function () {
        if (!settled && !nativeFullscreen()) fallback();
      }, 400);
    } else if (!nativeFullscreen()) {
      fallback();
    }
  } catch (err) {
    fallback();
  }
}

function exitFullscreen() {
  if (nativeFullscreen()) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) {
      try {
        const result = exit.call(document);
        if (result && result.catch) result.catch(function () {});
      } catch (err) {}
    }
  }
  if (fillMode || fillTimer) setFillMode(false);
}

function syncFullBtn() {
  const on = isFullscreen() || !!fillTimer;
  fullBtn.textContent = on ? "退出" : "全螢幕";
  fullBtn.setAttribute("aria-pressed", on ? "true" : "false");
}

function onViewportChange() {
  if (nativeFullscreen() && fillMode) setFillMode(false);
  if (fillMode && !nativeFullscreen()) pinFill();
  else layout(false);
}

const fullBtn = document.getElementById("full-btn");
fullBtn.addEventListener("click", function (event) {
  event.stopPropagation();
  if (isFullscreen() || fillTimer) exitFullscreen();
  else enterFullscreen();
});
document.addEventListener("fullscreenchange", onViewportChange);
document.addEventListener("webkitfullscreenchange", onViewportChange);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", function () {
    if (fillMode && !nativeFullscreen()) pinFill();
  });
  window.visualViewport.addEventListener("scroll", function () {
    if (fillMode && !nativeFullscreen()) pinFill();
  });
}
stage.addEventListener("contextmenu", function (event) { event.preventDefault(); });

renderHotspots();
syncAuto();
syncFullBtn();
showOverview(false);
window.addEventListener("resize", function () {
  if (fillMode && !nativeFullscreen()) pinFill();
  else layout(false);
});

const startId = (location.hash || "").replace("#", "") || new URLSearchParams(location.search).get("part");
if (startId) {
  const found = REGIONS.find(function (region) { return region.id === startId; });
  if (found) openRegion(found, false);
}
</script>
