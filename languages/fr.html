<script>
(function () {
  const CFG = window.LANG_CFG;
  const levels = window.LANG_LEVELS;
  const SCORE_URL = window.SCORE_URL || "https://script.google.com/macros/s/AKfycbyQsIuKgSBXqPYXENmsbS79X2ND6_otmq9PefobcVhpr6uapZko-6SIs8bK7mo7xMHhdg/exec";
  const TOKEN = "chilin-edu-2026";

  let cur = 0;
  let scores = new Array(levels.length).fill(0);
  let studentClass = "";
  let studentNo = "";
  let rec = null;
  let micTimeout = null;
  let listening = false;
  let audioCtx = null;
  let currentSource = null;
  let bufCache = {};
  let lastAlts = [];
  let scoredThisListen = false;
  let ttsText = "";
  let ttsLang = "";

  const synth = window.speechSynthesis;
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  function $(id) { return document.getElementById(id); }

  function isTouchMac() {
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || isTouchMac();
  }
  function isSafari() {
    const ua = navigator.userAgent;
    return /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Chrome\//.test(ua);
  }

  function fold(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[''`´’]/g, "'")
      .replace(/[\s.?!,。！？、，·・]/g, "");
  }

  function setAudioSession() {
    if (navigator.audioSession) {
      try { navigator.audioSession.type = "play-and-record"; } catch (e) {}
    }
  }

  function unlockAudio() {
    setAudioSession();
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
    } catch (e) {}
  }

  function loadVoices() {
    if (!synth) return [];
    return synth.getVoices() || [];
  }
  if (synth && typeof synth.onvoiceschanged !== "undefined") {
    synth.onvoiceschanged = loadVoices;
    loadVoices();
  }

  function pickVoice(lang) {
    const voices = loadVoices();
    const want = String(lang || "").toLowerCase().replace("_", "-");
    const prefix = want.split("-")[0];
    let best = null, bestN = 0;
    voices.forEach(function (v) {
      const vl = (v.lang || "").toLowerCase().replace("_", "-");
      const name = (v.name || "").toLowerCase();
      if (/siri/.test(name)) return;
      let n = 0;
      if (vl === want) n = 4;
      else if (vl.startsWith(want)) n = 3;
      else if (vl.startsWith(prefix)) n = 1;
      if (prefix === "zh" && /hk|yue|sin-?ji|sinji|cantonese|善怡/.test(vl + " " + name)) n = 5;
      if (prefix === "ja" && /kyoko|きょうこ/.test(name)) n = 5;
      if (prefix === "ko" && /yuna|유나/.test(name)) n = 5;
      if (prefix === "fr" && /thomas|amélie|amelie/.test(name)) n = 5;
      if (n > bestN) { best = v; bestN = n; }
    });
    return best;
  }

  function speakSynth(text, lang) {
    if (!synth || !text || isIOS()) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = lang.indexOf("zh") === 0 ? 0.92 : 0.8;
    const voice = pickVoice(lang);
    if (voice) u.voice = voice;
    try { synth.speak(u); } catch (e) {}
  }

  function stopTts() {
    if (currentSource) {
      try { currentSource.onended = null; currentSource.stop(); } catch (e) {}
      currentSource = null;
    }
    if (synth) {
      try { synth.cancel(); } catch (e) {}
    }
    setPlaying(false);
  }

  function setPlaying(on) {
    ["explainBtn", "demoBtn"].forEach(function (id) {
      const el = $(id);
      if (el) el.classList.toggle("playing", !!on);
    });
  }

  function playBuffer(buf) {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    currentSource = src;
    src.onended = function () {
      if (currentSource === src) {
        currentSource = null;
        setPlaying(false);
        setMsg("", "");
      }
    };
    src.start(0);
  }

  function playTts(text, lang, kind) {
    ttsText = text;
    ttsLang = lang;
    unlockAudio();
    stopTts();
    if (!text) return;
    setPlaying(true);
    setMsg("🔊 正在播放…", "#666");
    const i = String(cur).padStart(2, "0");
    const url = "audio/" + CFG.key + "/" + kind + i + ".mp3";

    if (bufCache[url]) {
      playBuffer(bufCache[url]);
      return;
    }
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("http");
      return r.arrayBuffer();
    }).then(function (arr) {
      if (!audioCtx) unlockAudio();
      return audioCtx.decodeAudioData(arr.slice(0));
    }).then(function (buf) {
      bufCache[url] = buf;
      playBuffer(buf);
    }).catch(function () {
      setPlaying(false);
      speakSynth(ttsText, ttsLang);
      if (isIOS()) setMsg("未能播放聲音，請再按一次", "var(--fail)");
      else setMsg("", "");
    });
  }

  function setMsg(text, color) {
    const el = $("score-msg");
    el.textContent = text || "";
    el.style.color = color || "";
  }

  function showBanner(text) {
    document.querySelectorAll(".mic-banner").forEach(function (el) {
      if (!text) {
        el.classList.remove("show");
        el.textContent = "";
        return;
      }
      el.textContent = text;
      el.classList.add("show");
    });
  }

  function applyScore(alts) {
    if (scoredThisListen) return;
    scoredThisListen = true;
    const speechRaw = (alts && alts[0]) || "";
    $("heard").textContent = speechRaw ? ("我聽到：" + speechRaw) : "";

    const target = fold(levels[cur][CFG.readField] || levels[cur][CFG.wordField]);
    let score = 0;
    (alts || []).forEach(function (t) {
      const speech = fold(t);
      if (!speech) return;
      let s = 0;
      if (speech === target) s = 100;
      else if (speech.includes(target) || target.includes(speech)) s = 85;
      else {
        let matches = 0;
        const sArr = speech.split("");
        target.split("").forEach(function (ch) { if (sArr.indexOf(ch) >= 0) matches++; });
        const ratio = target.length ? matches / target.length : 0;
        if (ratio >= 0.4) s = 75;
        else if (ratio >= 0.1) s = 60;
      }
      if (s > score) score = s;
    });

    try { if (rec) rec.stop(); } catch (e) {}

    if (score >= 60) {
      setMsg(score + CFG.okMsg, "var(--win)");
      scores[cur] = score;
      $("val-" + cur).textContent = score + "分";
      setTimeout(nextLevel, 1000);
    } else {
      setMsg(CFG.failMsg, "var(--fail)");
    }
  }

  function initRec() {
    if (!SpeechRec || rec) return;
    rec = new SpeechRec();
    rec.lang = CFG.recogLang;
    rec.continuous = !!isIOS();
    rec.interimResults = !!isIOS();
    rec.maxAlternatives = 5;

    rec.onstart = function () {
      listening = true;
      scoredThisListen = false;
      lastAlts = [];
      clearTimeout(micTimeout);
      $("micBtn").classList.add("recording");
      $("micBtn").textContent = "■ 正在聆聽… 請朗讀";
      setMsg(CFG.listenMsg, "#666");
      $("heard").textContent = "";
      micTimeout = setTimeout(function () {
        try { rec.stop(); } catch (e) {}
        if (!scoredThisListen && !lastAlts.length) {
          setMsg("⚠️ 沒偵測到聲音，請再按一次。若 iPhone 問麥克風，請撳允許。", "var(--fail)");
        }
      }, 8000);
    };

    rec.onaudiostart = function () {
      setMsg("🎤 咪已開，請而家朗讀", "#666");
    };

    rec.onend = function () {
      listening = false;
      $("micBtn").classList.remove("recording");
      $("micBtn").textContent = CFG.btnMic;
      clearTimeout(micTimeout);
      if (!scoredThisListen && lastAlts.length) applyScore(lastAlts);
    };

    rec.onerror = function (ev) {
      clearTimeout(micTimeout);
      listening = false;
      $("micBtn").classList.remove("recording");
      $("micBtn").textContent = CFG.btnMic;
      const err = (ev && ev.error) || "";
      if (err === "not-allowed" || err === "service-not-allowed") {
        showBanner("請允許使用麥克風：設定 → Safari → 麥克風 → 允許。然後再撳綠色掣。");
        setMsg("未能開啟麥克風", "var(--fail)");
      } else if (err === "no-speech") {
        setMsg("⚠️ 沒偵測到聲音，請再按一次", "var(--fail)");
      } else if (err !== "aborted") {
        setMsg("請再按一次朗讀", "#666");
      }
    };

    rec.onresult = function (e) {
      const alts = [];
      let isFinal = false;
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r[0] && r[0].transcript) alts.push(r[0].transcript);
        for (let j = 1; j < r.length; j++) {
          if (r[j] && r[j].transcript) alts.push(r[j].transcript);
        }
        if (r.isFinal) isFinal = true;
      }
      if (!alts.length) return;
      lastAlts = alts;
      $("heard").textContent = "我聽到：" + alts[0];
      if (isFinal || !isIOS()) applyScore(alts);
    };
  }

  function toggleMic() {
    unlockAudio();
    stopTts();
    setAudioSession();
    if (!SpeechRec) {
      showBanner("此瀏覽器未能評分朗讀。iPhone／iPad 請用 Safari 開啟。");
      return;
    }
    if (location.protocol === "file:") {
      showBanner("朗讀評分請用 Safari 掃描網站二維碼開啟。");
      return;
    }
    initRec();
    if (!rec) return;
    if (listening) {
      try { rec.stop(); } catch (e) {}
      return;
    }
    scoredThisListen = false;
    lastAlts = [];
    try {
      rec.start();
    } catch (e) {
      try { rec.abort(); } catch (err) {}
      try { rec.start(); } catch (err2) {
        showBanner("未能開始聆聽。請再按綠色掣。若彈出詢問，請允許麥克風。");
      }
    }
  }

  function identityOk() {
    const c = ($("class-input").value || "").trim().slice(0, 8);
    const n = ($("no-input").value || "").trim();
    return { ok: c.length >= 1 && /^\d{1,3}$/.test(n), class: c, no: n };
  }

  function refreshGo() {
    $("startBtn").disabled = !identityOk().ok;
  }

  function startGame() {
    const id = identityOk();
    if (!id.ok) {
      setLoginWarn("請填寫班別，學號只可填 1 至 3 個數字。");
      return;
    }
    studentClass = id.class;
    studentNo = id.no;
    unlockAudio();
    $("login-screen").style.display = "none";
    $("game-area").classList.add("on");
    $("display-class").textContent = studentClass;
    $("display-no").textContent = studentNo;
    initScoreBoard();
    initRec();
    if (isIOS() && !isSafari()) {
      showBanner("iPhone／iPad 請用 Safari 開啟，綠色朗讀掣先會收到把聲。");
    }
  }

  function setLoginWarn(text) {
    const el = $("login-warn");
    el.textContent = text;
    el.classList.add("warn");
  }

  function initScoreBoard() {
    const list = $("score-list");
    list.innerHTML = "";
    levels.forEach(function (_, i) {
      const div = document.createElement("div");
      div.className = "score-item";
      div.id = "row-" + i;
      div.innerHTML = "<b>#" + (i + 1) + "</b><span id='val-" + i + "'>---</span>";
      list.appendChild(div);
    });
    updateHighlight();
  }

  function updateHighlight() {
    document.querySelectorAll(".score-item").forEach(function (el) { el.classList.remove("current-row"); });
    const row = $("row-" + cur);
    if (row) {
      row.classList.add("current-row");
      row.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  function playExplain() {
    $("explain-text").textContent = levels[cur].explain;
    playTts(levels[cur].explain, "zh-HK", "e");
  }

  function playDemo() {
    const text = levels[cur][CFG.readField] || levels[cur][CFG.wordField];
    playTts(text, CFG.speakLang, "w");
  }

  function nextLevel() {
    if (cur < levels.length - 1) {
      cur++;
      refreshUI();
    } else {
      showFinal();
    }
  }
  function prevLevel() {
    if (cur > 0) {
      cur--;
      refreshUI();
    }
  }
  function skipLevel() {
    scores[cur] = 0;
    $("val-" + cur).textContent = "跳過";
    nextLevel();
  }

  function refreshUI() {
    stopTts();
    $("progress").textContent = "關卡：" + (cur + 1) + " / " + levels.length;
    $("target-word").textContent = levels[cur][CFG.wordField];
    $("target-mean").textContent = levels[cur].mean;
    setMsg("", "");
    $("heard").textContent = "";
    $("explain-text").textContent = CFG.explainHint;
    $("main-play-area").style.display = "block";
    $("final-area").style.display = "none";
    updateHighlight();
  }

  function askSubmit() {
    $("confirm-modal").classList.add("show");
  }
  function hideModal() {
    $("confirm-modal").classList.remove("show");
  }

  function showFinal() {
    hideModal();
    stopTts();
    try { if (rec) rec.stop(); } catch (e) {}
    $("main-play-area").style.display = "none";
    $("final-area").style.display = "block";
    const avg = Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / levels.length);
    $("total-avg").textContent = avg;
    submitToGoogleForm(studentClass, studentNo, avg);
    submitToSheet(studentClass, studentNo, avg);
  }

  function submitToGoogleForm(cls, no, score) {
    const studentInfo = cls + "_(" + no + ")";
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "https://docs.google.com/forms/d/e/" + CFG.formID + "/formResponse";
    form.target = "hidden_iframe";
    const in1 = document.createElement("input");
    in1.name = "entry.788411312";
    in1.value = studentInfo;
    form.appendChild(in1);
    const in2 = document.createElement("input");
    in2.name = "entry.488980092";
    in2.value = String(score);
    form.appendChild(in2);
    let ifr = document.querySelector("iframe[name='hidden_iframe']");
    if (!ifr) {
      ifr = document.createElement("iframe");
      ifr.name = "hidden_iframe";
      ifr.style.display = "none";
      document.body.appendChild(ifr);
    }
    document.body.appendChild(form);
    form.submit();
    setTimeout(function () { try { form.remove(); } catch (e) {} }, 2000);
    setTimeout(function () { $("save-status").textContent = "✅ 成績已成功上傳！"; }, 1500);
  }

  function submitToSheet(cls, no, score) {
    if (!SCORE_URL) return;
    const done = scores.filter(function (s) { return s >= 60; }).length;
    const payload = {
      token: TOKEN,
      class: cls,
      no: no,
      activity: CFG.activity,
      level: "平均",
      result: String(score),
      stars: String(done),
      hero: "",
      seconds: ""
    };
    try {
      fetch(SCORE_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) {}
  }

  $("class-input").addEventListener("input", refreshGo);
  $("no-input").addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 3);
    refreshGo();
  });
  $("startBtn").addEventListener("click", startGame);
  $("explainBtn").addEventListener("click", playExplain);
  $("demoBtn").addEventListener("click", playDemo);
  $("micBtn").addEventListener("click", toggleMic);
  $("prevBtn").addEventListener("click", prevLevel);
  $("skipBtn").addEventListener("click", skipLevel);
  $("finishBtn").addEventListener("click", askSubmit);
  $("cancelSubmit").addEventListener("click", hideModal);
  $("okSubmit").addEventListener("click", showFinal);
  $("againBtn").addEventListener("click", function () { location.reload(); });

  document.addEventListener("touchstart", function () { unlockAudio(); }, { once: true, passive: true });
  document.addEventListener("click", function () { unlockAudio(); }, { once: true });

  refreshGo();
})();

</script>
</body>
</html>
