<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="成績後台" />
  <title>張老師成績後台　佛教志蓮小學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #b71c1c;
      --red-dark: #7f1010;
      --navy: #1e3a8a;
      --gold: #e6b325;
      --gold-2: #f4d35e;
      --cream: #fff8ee;
      --paper: #fffdf8;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --ok: #15803d;
      --bad: #b91c1c;
      --line: #ead9c6;
      --soft: #f3ece3;
      --safe-t: env(safe-area-inset-top);
      --safe-b: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    html, body {
      margin: 0; min-height: 100%; min-height: 100dvh;
      font-family: "Noto Sans TC", "PingFang HK", "PingFang TC", "Heiti TC", sans-serif;
      color: var(--ink);
      background: #efe4d6;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(183,28,28,.16), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(230,179,37,.18), transparent 55%);
    }
    button, input, select { font: inherit; }
    button {
      appearance: none; border: 0; cursor: pointer; font-weight: 900;
      border-radius: 14px;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .hidden { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }

    img.zhang-sir-mark {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      width: 48px; height: 48px; z-index: 1000;
      pointer-events: none; user-select: none;
    }

    /* login */
    #gate {
      position: relative; z-index: 1;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));
    }
    .gate-card {
      width: min(460px, 100%);
      background: var(--paper);
      border: 5px solid var(--red);
      border-radius: 28px;
      padding: 22px 20px 24px;
      box-shadow: 0 10px 0 var(--red-dark);
      text-align: center;
    }
    .gate-card img.hero {
      width: min(100%, 280px); height: auto;
      border-radius: 18px; border: 3px solid #fff;
      box-shadow: 0 4px 0 rgba(127,16,16,.16);
      background: #e8f3ee;
    }
    .gate-card .school { margin: 14px 0 0; color: var(--red); font-weight: 800; font-size: 14px; }
    .gate-card h1 {
      margin: 4px 0 8px; font-size: clamp(26px, 7vw, 34px);
      letter-spacing: .12em; color: var(--red-dark);
    }
    .gate-card .hint { margin: 0 0 16px; color: var(--muted); font-weight: 700; line-height: 1.55; }
    label.field { display: block; text-align: left; font-size: 13px; font-weight: 800; color: var(--navy); }
    label.field input {
      width: 100%; margin-top: 6px; text-align: center;
      min-height: 52px; font-size: 22px; font-weight: 900; letter-spacing: .24em;
      border: 3px solid var(--line); border-radius: 14px; background: #fff;
    }
    label.field input:focus { outline: 0; border-color: var(--navy); background: #eef3ff; }
    .primary {
      width: 100%; min-height: 52px; margin-top: 14px;
      background: var(--red); color: #fff; font-size: 18px;
      box-shadow: 0 4px 0 var(--red-dark);
    }
    .primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--red-dark); }
    .ghost {
      width: 100%; min-height: 44px; margin-top: 8px;
      background: #fff; color: var(--navy); border: 3px solid var(--navy); font-size: 15px;
    }
    .gate-msg { min-height: 22px; margin: 10px 0 0; font-weight: 800; color: var(--bad); }

    /* app */
    #app { position: relative; z-index: 1; display: none; }
    body.in #gate { display: none; }
    body.in #app { display: block; }

    .top {
      background: linear-gradient(180deg, var(--red), var(--red-dark));
      color: #fff;
      padding: calc(12px + var(--safe-t)) 16px 16px;
      box-shadow: 0 8px 0 rgba(127,16,16,.35);
    }
    .top-inner { max-width: 1120px; margin: 0 auto; }
    .top .kicker { margin: 0; font-size: 13px; font-weight: 800; color: var(--gold-2); }
    .top h1 { margin: 2px 0 0; font-size: clamp(22px, 5vw, 30px); letter-spacing: .1em; }
    .top .sub { margin: 8px 0 0; font-weight: 800; opacity: .92; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .top-actions a, .top-actions button {
      width: auto; min-height: 40px; padding: 8px 14px; margin: 0;
      background: rgba(255,255,255,.14); color: #fff; border: 2px solid rgba(255,255,255,.4);
      text-decoration: none; display: inline-flex; align-items: center; font-size: 14px;
    }

    .dash-wrap { max-width: 1120px; margin: 0 auto; padding: 16px 14px calc(28px + var(--safe-b)); }

    .stats {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
      margin: -28px 0 14px;
    }
    .stat {
      background: var(--paper); border: 3px solid #fff; border-radius: 18px;
      padding: 12px 12px 14px; box-shadow: 0 8px 24px rgba(127,16,16,.12);
      min-height: 92px;
    }
    .stat .lab { font-size: 12px; font-weight: 800; color: var(--muted); }
    .stat .big { font-size: clamp(28px, 6vw, 40px); font-weight: 900; color: var(--red-dark); line-height: 1.1; margin-top: 4px; }
    .stat .tiny { font-size: 12px; font-weight: 700; color: var(--navy); margin-top: 2px; }
    .stat.ok .big { color: var(--ok); }
    .stat.warn .big { color: var(--bad); }

    .toolbar, .panel {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tabs button, .chip {
      width: auto; min-height: 40px; padding: 6px 12px; margin: 0;
      background: #fff; color: var(--navy); border: 2px solid var(--line); font-size: 14px;
    }
    .tabs button.on, .chip.on {
      background: var(--red); color: #fff; border-color: var(--red);
    }
    .dates { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .search {
      margin-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 8px;
    }
    .search input {
      min-height: 44px; border: 3px solid var(--line); border-radius: 14px;
      padding: 8px 12px; font-weight: 800; width: 100%;
    }
    .search input:focus { outline: 0; border-color: var(--navy); }
    .toolbtn {
      width: auto; min-height: 44px; padding: 8px 12px; margin: 0;
      background: #fff; color: var(--navy); border: 3px solid var(--navy); font-size: 14px;
    }

    .classes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .classes button { min-height: 36px; font-size: 13px; }

    .h2 {
      margin: 0 0 10px; font-size: 18px; color: var(--red-dark); letter-spacing: .06em;
    }
    .muted { color: var(--muted); font-weight: 700; }

    .meters { display: grid; gap: 8px; }
    .meter {
      display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center;
      background: #fff; border: 2px solid var(--line); border-radius: 14px;
      padding: 8px 10px; cursor: pointer; text-align: left; width: 100%;
    }
    .meter:hover { border-color: var(--navy); }
    .meter .cls { font-weight: 900; color: var(--navy); font-size: 16px; }
    .bar { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); }
    .meter.done .bar > span { background: var(--ok); }
    .meter .frac { font-weight: 900; color: var(--ink); font-size: 14px; white-space: nowrap; }

    .split { display: grid; gap: 12px; }
    @media (min-width: 860px) {
      .split.today { grid-template-columns: 1.4fr .8fr; align-items: start; }
    }

    .list { display: grid; gap: 8px; }
    .row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px;
      background: #fff; border: 2px solid var(--line); border-radius: 16px;
      padding: 10px 12px; align-items: center;
    }
    .row .name { font-weight: 900; font-size: 18px; color: var(--red-dark); }
    .row .who { font-weight: 800; font-size: 13px; color: var(--muted); }
    .row .kg { font-weight: 900; font-size: 22px; color: var(--navy); text-align: right; }
    .row .lr { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; }
    .delta { font-weight: 900; font-size: 13px; }
    .delta.up { color: var(--ok); }
    .delta.down { color: var(--bad); }
    .delta.same { color: var(--muted); }
    .row.miss { opacity: .95; background: #fff6f6; border-color: #f0c4c4; }
    .row.miss .kg { color: var(--muted); font-size: 15px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-top: 6px; }
    .danger {
      width: auto; min-height: 34px; padding: 4px 10px; margin: 0;
      background: #fff; color: var(--bad); border: 2px solid var(--bad); font-size: 12px;
    }
    .ghost-mini {
      width: auto; min-height: 34px; padding: 4px 10px; margin: 0;
      background: #fff; color: var(--navy); border: 2px solid var(--navy); font-size: 12px;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      background: #fff; border: 2px solid var(--line); border-radius: 999px;
      padding: 8px 12px; font-weight: 800; font-size: 14px;
    }
    .empty { text-align: center; font-weight: 800; color: var(--muted); padding: 28px 8px; }

    .timeline { display: grid; gap: 8px; }
    .titem {
      display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: start;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); margin-top: 8px; }
    .titem .when { font-weight: 800; color: var(--navy); }
    .pick {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    select {
      min-height: 44px; border: 3px solid var(--line); border-radius: 14px;
      padding: 8px 10px; font-weight: 800; background: #fff; width: 100%;
    }

    .toast {
      position: fixed; left: 50%; bottom: calc(20px + var(--safe-b));
      transform: translateX(-50%); z-index: 40;
      background: var(--navy); color: #fff; font-weight: 800;
      padding: 10px 16px; border-radius: 999px; max-width: 90%;
    }
    .status { font-size: 13px; font-weight: 800; color: var(--muted); margin: 0 0 8px; }

    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr 1fr; margin-top: 12px; }
      .search { grid-template-columns: 1fr; }
      img.zhang-sir-mark { width: 44px; height: 44px; }
    }

    /* 同教學網站第一頁同一個排版，只換深藍，一眼知係後台 */
    :root {
      --hub: #1e3a8a;
      --hub-dark: #12245c;
      --hub-card: #fffef6;
      --hub-ink: #1a1a28;
      --hub-muted: #3d4a66;
      --hub-line: #c5cde0;
      --hub-shadow: #8fa0c4;
    }
    body.hub-on {
      color: var(--hub-ink);
      background: linear-gradient(#8fa8d8, #e4d2c0) fixed;
    }
    body.hub-on::before { display: none; }
    header.hub {
      background: var(--hub);
      color: #fff;
      text-align: center;
      padding: max(14px, env(safe-area-inset-top)) 16px 16px;
      box-shadow: 0 8px 0 var(--hub-dark);
      position: relative;
    }
    header.hub .school { margin: 0; font-size: 15px; font-weight: 700; color: var(--gold-2); }
    header.hub h1 { margin: 6px 0 0; font-size: clamp(22px, 6vw, 26px); font-weight: 900; letter-spacing: .04em; }
    header.hub p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; opacity: .95; }
    header.hub img.zhang-sir-mark {
      position: absolute;
      right: 10px;
      top: max(8px, env(safe-area-inset-top));
      width: 44px; height: 44px; z-index: 5;
      pointer-events: none;
    }
    .btn-edit {
      position: absolute;
      right: 60px;
      top: max(10px, env(safe-area-inset-top));
      background: var(--gold-2);
      color: var(--hub-dark);
      border: 3px solid #c9a227;
      min-height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      box-shadow: 0 3px 0 #a7861c;
    }
    .hub-wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px calc(48px + env(safe-area-inset-bottom)); }
    .chars { display: flex; justify-content: center; gap: 24px; margin: 8px 0 18px; }
    .chars img { height: 88px; width: auto; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
    .note {
      background: var(--hub-card);
      border: 5px solid var(--hub);
      border-radius: 22px;
      padding: 14px 16px;
      margin-bottom: 18px;
      box-shadow: 0 6px 0 var(--hub-dark);
      line-height: 1.55;
      font-weight: 700;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
      gap: 14px;
    }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--hub-card);
      border: 5px solid var(--hub-line);
      border-radius: 24px;
      padding: 16px 16px 14px;
      box-shadow: 0 6px 0 var(--hub-shadow);
      cursor: pointer;
      min-height: 44px;
    }
    a.card:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--hub-shadow); }
    a.card .emoji { font-size: 42px; line-height: 1; }
    a.card h2 { margin: 8px 0 6px; font-size: 20px; color: var(--hub-dark); line-height: 1.4; }
    a.card p { margin: 0; color: var(--hub-muted); font-size: 15px; font-weight: 700; line-height: 1.5; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn-back {
      background: #fff; color: var(--hub-dark); border: 4px solid var(--hub);
      min-height: 44px; border-radius: 16px; padding: 12px 16px;
      font-weight: 900; text-decoration: none; display: inline-block;
    }
    h3.sec { margin: 0 0 12px; font-size: 24px; color: var(--hub-dark); }
    .hub-foot {
      text-align: center; padding: 8px 16px 28px; color: var(--hub-dark);
      font-size: 13px; font-weight: 700; line-height: 1.6;
    }
    .pin-row { margin-top: 12px; }
    .pin-row input {
      width: 100%; min-height: 52px; text-align: center;
      font-size: 22px; font-weight: 900; letter-spacing: .24em;
      border: 3px solid var(--hub-line); border-radius: 14px; background: #fff;
    }
    .pin-row input:focus { outline: 0; border-color: var(--hub); background: #eef3ff; }
    .pin-go {
      width: 100%; min-height: 52px; margin-top: 12px;
      background: var(--hub); color: #fff; font-size: 18px;
      box-shadow: 0 4px 0 var(--hub-dark);
    }
    .pin-go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--hub-dark); }
    .gate-msg { min-height: 22px; margin: 10px 0 0; font-weight: 800; color: var(--bad); }
    body.dash-on header.hub, body.dash-on #shell, body.dash-on #hubFoot { display: none !important; }
    body.dash-on #dash { display: block; }
    #dash { display: none; }
    body.bean-on header.hub, body.bean-on #shell, body.bean-on #hubFoot, body.bean-on #dash { display: none !important; }
    body.bean-on #bean { display: block; }
    #bean { display: none; }
    .bean-top { background: linear-gradient(180deg, #2f7d32, #1b5e20); }
    .bean-top .kicker { color: #f4d35e; }
    .photo-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
      gap: 10px;
    }
    .photo-card {
      background: #fff; border: 3px solid var(--line); border-radius: 16px;
      overflow: hidden; cursor: pointer; text-align: left; padding: 0; width: 100%;
      box-shadow: 0 3px 0 rgba(27,94,32,.16);
    }
    .photo-card img {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #e8f5e9;
    }
    .photo-card .cap {
      padding: 8px 10px 10px; font-weight: 800; font-size: 13px; line-height: 1.35; color: var(--ink);
    }
    .photo-card .cap .who { color: #1b5e20; font-size: 15px; }
    .photo-card .cap .meta { color: var(--muted); font-size: 12px; font-weight: 700; }
    .photo-card.miss {
      min-height: 120px; display: flex; align-items: center; justify-content: center;
      background: #fff6f6; border-color: #f0c4c4; cursor: default;
    }
    #beanLight {
      position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 60;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; cursor: zoom-out;
    }
    #beanLight img {
      max-width: min(96vw, 920px); max-height: 78vh; object-fit: contain;
      border-radius: 16px; background: #111; box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    #beanLight .cap {
      color: #fff; font-weight: 800; text-align: center; margin-top: 12px; line-height: 1.5;
    }
    @media (max-width: 560px) {
      header.hub { padding-right: 148px; text-align: left; }
      .btn-edit { font-size: 13px; padding: 8px 10px; }
    }
  </style>
</head>
<body class="hub-on">
<header class="hub">
  <p class="school">佛教志蓮小學</p>
  <h1>張老師成績後台</h1>
  <p>供教師查看成績。學生及家長不會看到這一頁。</p>
  <button class="btn-edit hidden" id="lockBtn" type="button">離開後台</button>
  <img class="zhang-sir-mark" src="zhang-sir-gold.png" alt="張Sir" width="44" height="44">
  <script src="zhang-sir.js"></script>
</header>
<main class="hub-wrap" id="shell"></main>
<footer class="hub-foot" id="hubFoot">此頁只供教師使用。<br>學生及家長不會看到成績後台。</footer>

<div id="dash">
  <header class="top">
    <div class="top-inner">
      <p class="kicker">佛教志蓮小學　體育 · 成績後台</p>
      <h1>手握力成績</h1>
      <p class="sub" id="dateLabel">日期載入中</p>
      <div class="top-actions">
        <a href="#/">返回目錄</a>
        <a href="index.html">學生輸入頁</a>
        <button type="button" id="reloadBtn">重新整理</button>
        <button type="button" id="csvBtn">匯出 CSV</button>
        <button type="button" id="dashLock">離開後台</button>
      </div>
    </div>
  </header>

  <div class="dash-wrap">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button type="button" data-tab="today" class="on">今日課堂</button>
        <button type="button" data-tab="class">全班成績</button>
        <button type="button" data-tab="person">個人歷程</button>
      </div>
      <div class="classes" id="classChips"></div>
      <div class="dates" id="dateChips"></div>
      <div class="search">
        <input id="q" type="search" placeholder="搜尋姓名、班別或學號" autocomplete="off" />
        <button class="toolbtn" id="sortBtn" type="button">按學號</button>
      </div>
      <p class="status" id="loadStatus">正在讀取成績…</p>
    </div>

    <section class="panel" id="main"></section>
  </div>
</div>

<div id="bean">
  <header class="top bean-top">
    <div class="top-inner">
      <p class="kicker">佛教志蓮小學　科學 · 成績後台</p>
      <h1>家中種綠豆</h1>
      <p class="sub">一眼睇晒所有盆栽相片</p>
      <div class="top-actions">
        <a href="#/">返回目錄</a>
        <a id="beanPlay" href="../beanlog/">學生輸入頁</a>
        <button type="button" id="beanReload">重新整理</button>
        <button type="button" id="beanLock">離開後台</button>
      </div>
    </div>
  </header>
  <div class="dash-wrap">
    <div class="stats" id="beanStats"></div>
    <div class="toolbar">
      <div class="tabs" id="beanTabs">
        <button type="button" data-btab="photos" class="on">全部相片</button>
        <button type="button" data-btab="miss">未交名單</button>
      </div>
      <div class="classes" id="beanClassChips"></div>
      <div class="dates" id="beanDayChips"></div>
      <div class="search">
        <input id="beanQ" type="search" placeholder="搜尋姓名、班別或學號" autocomplete="off" />
      </div>
      <p class="status" id="beanStatus">正在讀取相片…</p>
    </div>
    <section class="panel" id="beanMain"></section>
  </div>
</div>

  const $ = (id) => document.getElementById(id);
  const state = {

  function todayYmd() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date());
    const g = (t) => parts.find(p => p.type === t).value;
    return g("year") + "-" + g("month") + "-" + g("day");
  }
  function prettyDate(ymd) {
    if (!ymd) return "";
    const [y, m, d] = ymd.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, 4, 0, 0));
    const wk = new Intl.DateTimeFormat("zh-HK", { timeZone: "Asia/Hong_Kong", weekday: "short" }).format(dt);
    return y + "年" + m + "月" + d + "日（" + wk + "）";
  }
  function kg(n) {
    const x = Number(n);
    if (!isFinite(x)) return "—";
    return (Math.round(x * 10) / 10).toFixed(1);
  }
  function avgKg(left, right) { return Math.round(((Number(left) + Number(right)) / 2) * 10) / 10; }
  function gradeOf(klass) {
    const m = String(klass || "").match(/^(\d)/);
    return m ? Number(m[1]) : 0;
  }
  function bandOf(klass) {
    const g = gradeOf(klass);
    if (g >= 1 && g <= 3) return "low";
    if (g >= 4 && g <= 6) return "high";
    return "";
  }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }
  function parseKgInput(s) {
    const n = parseFloat(String(s || "").replace(",", ".").replace(/[^\d.]/g, ""));
    if (!isFinite(n) || n < 1 || n > 100) return null;
    return Math.round(n * 10) / 10;
  }
  function toast(msg) {
    document.querySelectorAll(".toast").forEach(n => n.remove());
    const n = document.createElement("div");
    n.className = "toast";
    n.textContent = msg;
    document.body.append(n);
    setTimeout(() => n.remove(), 2600);
  }
  function keyOf(klass, no) { return String(klass) + "\t" + String(no); }

  function ingestRoster(data) {
    const map = {};
    function add(klass, no, name) {
      const c = String(klass || "").trim().toUpperCase().replace(/\s+/g, "");
      const n = String(parseInt(String(no || "").replace(/[^\d]/g, ""), 10));
      const nm = String(name || "").trim();
      if (!c || !n || n === "NaN" || !nm) return;
      if (!map[c]) map[c] = {};
      map[c][n] = nm;
    }
    (data.students || []).forEach(r => add(r.class, r.no, r.name));
    state.roster = map;
  }
  function classList() {
    const set = {};
    Object.keys(state.roster).forEach(c => { set[c] = true; });
    liveScores(state.records).forEach(r => { if (r.klass) set[r.klass] = true; });
    return Object.keys(set).sort((a, b) => gradeOf(a) - gradeOf(b) || a.localeCompare(b, "zh-Hant"));
  }
  function lookupName(klass, no) {
    const map = state.roster[String(klass || "").toUpperCase()];
    const n = String(parseInt(no, 10));
    return (map && map[n]) ? map[n] : "";
  }
  function rosterStudents(filter) {
    const out = [];
    classList().forEach(klass => {
      if (!matchFilter(klass, filter)) return;
      Object.keys(state.roster[klass]).sort((a, b) => Number(a) - Number(b)).forEach(no => {
        out.push({ klass, no, name: state.roster[klass][no] });
      });
    });
    return out;
  }
  function matchFilter(klass, filter) {
    const f = filter || state.filter;
    if (f === "all") return true;
    if (f === "low") return bandOf(klass) === "low";
    if (f === "high") return bandOf(klass) === "high";
    return klass === f;
  }

  function scriptJsonp(src, cb) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 18000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      window[cb] = function (data) { cleanup(); resolve(data); };
      s.onerror = function () { cleanup(); reject(new Error("network")); };
      s.src = src;
      document.head.appendChild(s);
    });
  }
  function gvizCell(row, i) {
    const c = row && row.c && row.c[i];
    if (!c) return "";
    if (c.v === null || c.v === undefined) return c.f || "";
    return c.v;
  }
  function ymdFromGviz(v, formatted) {
    const m = String(v || "").match(/^Date\((\d+),(\d+),(\d+)/);
    if (m) {
      return m[1] + "-" + String(Number(m[2]) + 1).padStart(2, "0") + "-" + String(Number(m[3])).padStart(2, "0");
    }
    const s = String(formatted || v || "");
    const hk = s.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
    if (hk) return hk[1] + "-" + String(hk[2]).padStart(2, "0") + "-" + String(hk[3]).padStart(2, "0");
    const iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    return iso ? iso[1] + "-" + iso[2] + "-" + iso[3] : "";
  }
  function parsePackedKg(result, stars, hero, seconds) {
    const text = [result, stars, hero, seconds].map(x => String(x || "")).join(" ");
    const pair = text.match(/左\s*([\d.]+)\s*右\s*([\d.]+)/) ||
      text.match(/L\s*([\d.]+)\s*R\s*([\d.]+)/i) ||
      String(result || "").match(/^([\d.]+)\s*[\/,]\s*([\d.]+)$/);
    let left = pair ? parseKgInput(pair[1]) : parseKgInput(hero);
    let right = pair ? parseKgInput(pair[2]) : parseKgInput(seconds);
    if (left === null || right === null) return null;
    return { left, right, avg: avgKg(left, right) };
  }
  function recordsFromGviz(table) {
    const cols = (table.cols || []).map(c => String(c.label || c.id || ""));
    const idx = (name) => cols.indexOf(name);
    const iTime = idx("時間"), iClass = idx("班別"), iNo = idx("學號");
    const iLevel = idx("關卡"), iResult = idx("結果"), iStars = idx("星星");
    const iHero = idx("角色"), iSec = idx("用時秒");
    const iDate = idx("日期"), iLeft = idx("左手kg"), iRight = idx("右手kg");
    const out = [];
    (table.rows || []).forEach(row => {
      const klass = String(gvizCell(row, iClass) || "").trim().toUpperCase().replace(/\s+/g, "");
      const no = String(parseInt(String(gvizCell(row, iNo)), 10));
      if (!klass || !no || no === "NaN") return;
      const result = iResult >= 0 ? gvizCell(row, iResult) : "";
      const stars = iStars >= 0 ? gvizCell(row, iStars) : "";
      const level = iLevel >= 0 ? String(gvizCell(row, iLevel) || "") : "";
      const timeCell = row.c && iTime >= 0 ? row.c[iTime] : null;
      const date = (iDate >= 0 && ymdFromGviz("", gvizCell(row, iDate))) ||
        ymdFromGviz(timeCell && timeCell.v, timeCell && timeCell.f) ||
        ymdFromGviz("", level) || state.today;
      const tsMatch = String(timeCell && timeCell.v || "").match(/^Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)/);
      const ts = tsMatch ? Date.UTC(+tsMatch[1], +tsMatch[2], +tsMatch[3], +tsMatch[4], +tsMatch[5], +tsMatch[6]) : 0;
      if (/DELETE|刪除|\bDEL\b/i.test(String(result) + " " + String(stars))) {
        out.push({ klass, no, date: level === "ALL" ? "ALL" : date, ts, deleted: true, all: level === "ALL" });
        return;
      }
      let packed = null;
      if (iLeft >= 0 && iRight >= 0) {
        const left = parseKgInput(gvizCell(row, iLeft));
        const right = parseKgInput(gvizCell(row, iRight));
        if (left !== null && right !== null) packed = { left, right, avg: avgKg(left, right) };
      }
      if (!packed) packed = parsePackedKg(result, stars, gvizCell(row, iHero), gvizCell(row, iSec));
      if (!packed) return;
      out.push({ klass, no, date, ts, left: packed.left, right: packed.right, avg: packed.avg });
    });
    return out;
  }
  function liveScores(rows) {
    const allCut = {};
    (rows || []).forEach(r => {
      if (r.deleted && r.all) {
        const k = keyOf(r.klass, r.no);
        if (!allCut[k] || r.ts > allCut[k]) allCut[k] = r.ts;
      }
    });
    const byDay = {};
    (rows || []).forEach(r => {
      const k = keyOf(r.klass, r.no);
      if (allCut[k] && r.ts <= allCut[k]) return;
      if (r.all) return;
      const dk = k + "\t" + r.date;
      const cur = byDay[dk];
      if (!cur || r.ts >= cur.ts) byDay[dk] = r;
    });
    return Object.keys(byDay).map(k => byDay[k]).filter(r => !r.deleted);
  }
  function previousOf(rows, klass, no, beforeDate) {
    let found = null;
    liveScores(rows).forEach(r => {
      if (r.klass !== klass || r.no !== no || r.date >= beforeDate) return;
      if (!found || r.date > found.date || (r.date === found.date && r.ts > found.ts)) found = r;
    });
    return found;
  }
  function historyOf(rows, klass, no) {
    return liveScores(rows)
      .filter(r => r.klass === klass && r.no === no)
      .sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  }
  function onDate(rows, ymd) {
    return liveScores(rows).filter(r => r.date === ymd);
  }
  function latestByStudent(rows, filter) {
    const map = {};
    liveScores(rows).forEach(r => {
      if (!matchFilter(r.klass, filter)) return;
      const k = keyOf(r.klass, r.no);
      const cur = map[k];
      if (!cur || r.date > cur.date || (r.date === cur.date && r.ts >= cur.ts)) map[k] = r;
    });
    return Object.keys(map).map(k => map[k]);
  }
  function datesInRecords() {
    const set = {};
    liveScores(state.records).forEach(r => { if (r.date) set[r.date] = true; });
    set[state.today] = true;
    return Object.keys(set).sort().reverse();
  }

  async function fetchRecords() {
    const cb = "grip_admin_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    const tqx = encodeURIComponent("out:json;responseHandler:" + cb);
    const src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=" + tqx + "&sheet=" + encodeURIComponent(ACTIVITY) +
      "&headers=1&t=" + Date.now();
    const data = await scriptJsonp(src, cb);
    if (!data || data.status === "error" || !data.table) return [];
    return recordsFromGviz(data.table);
  }

  function passQ(klass, no, name) {
    const q = state.q.trim().toLowerCase();
    if (!q) return true;
    return (klass + " " + no + "號 " + (name || "")).toLowerCase().indexOf(q) >= 0;
  }
  function deltaHtml(cur, prev) {
    if (!prev) return `<div class="delta same">第一次</div>`;
    const diff = Math.round((cur.avg - prev.avg) * 10) / 10;
    if (diff > 0) return `<div class="delta up">▲ ${kg(diff)} kg</div>`;
    if (diff < 0) return `<div class="delta down">▼ ${kg(Math.abs(diff))} kg</div>`;
    return `<div class="delta same">＝ 相同</div>`;
  }
  function personBtn(klass, no) {
    return `<button class="ghost-mini" type="button" data-person="${esc(klass)}:${esc(no)}">睇歷程</button>`;
  }
  function delBtns(klass, no) {
    return `<div class="actions">
      ${personBtn(klass, no)}
      <button class="danger" type="button" data-del="today" data-class="${esc(klass)}" data-no="${esc(no)}">刪今日</button>
      <button class="danger" type="button" data-del="all" data-class="${esc(klass)}" data-no="${esc(no)}">刪全部</button>
    </div>`;
  }
  function scoreRow(r, extra) {
    const name = lookupName(r.klass, r.no) || "名單以外";
    const prev = extra && extra.prev;
    return `<article class="row">
      <div>
        <div class="name">${esc(name)}</div>
        <div class="who">${esc(r.klass)}　${esc(r.no)}號　${esc(prettyDate(r.date))}</div>
        ${delBtns(r.klass, r.no)}
      </div>
      <div>
        <div class="kg num">${kg(r.avg)} <span style="font-size:13px">kg</span></div>
        <div class="lr">左 ${kg(r.left)}　右 ${kg(r.right)}</div>
        ${deltaHtml(r, prev)}
      </div>
    </article>`;
  }
  function missRow(s) {
    return `<article class="row miss">
      <div>
        <div class="name">${esc(s.name)}</div>
        <div class="who">${esc(s.klass)}　${esc(s.no)}號</div>
      </div>
      <div class="kg">未量</div>
    </article>`;
  }

  function filteredToday() {
    return onDate(state.records, state.viewDate).filter(r => matchFilter(r.klass) && passQ(r.klass, r.no, lookupName(r.klass, r.no)));
  }
  function sortRows(rows) {
    const copy = rows.slice();
    if (state.sort === "kg") copy.sort((a, b) => b.avg - a.avg || a.klass.localeCompare(b.klass) || Number(a.no) - Number(b.no));
    else copy.sort((a, b) => a.klass.localeCompare(b.klass, "zh-Hant") || Number(a.no) - Number(b.no));
    return copy;
  }

  function renderStats() {
    const day = onDate(state.records, state.viewDate).filter(r => matchFilter(r.klass));
    const roster = rosterStudents();
    const doneKeys = {};
    day.forEach(r => { doneKeys[keyOf(r.klass, r.no)] = true; });
    const missing = roster.filter(s => !doneKeys[keyOf(s.klass, s.no)]);
    let best = null;
    day.forEach(r => { if (!best || r.avg > best.avg) best = r; });
    let up = 0;
    day.forEach(r => {
      const prev = previousOf(state.records, r.klass, r.no, r.date);
      if (prev && r.avg > prev.avg) up += 1;
    });
    const scope = state.filter === "all" ? "所選範圍：全校" :
      state.filter === "low" ? "所選範圍：低年班" :
      state.filter === "high" ? "所選範圍：高年班" : "所選範圍：" + state.filter;
    $("stats").innerHTML = `
      <div class="stat ok"><div class="lab">已量</div><div class="big num">${day.length}</div><div class="tiny">${scope}</div></div>
      <div class="stat warn"><div class="lab">未量</div><div class="big num">${missing.length}</div><div class="tiny">對照 ${roster.length} 人名單</div></div>
      <div class="stat"><div class="lab">當日最高</div><div class="big num">${best ? kg(best.avg) : "—"}</div><div class="tiny">${best ? esc(lookupName(best.klass, best.no) || (best.klass + " " + best.no + "號")) + "　" + kg(best.avg) + " kg" : "尚未有成績"}</div></div>
      <div class="stat"><div class="lab">比上次進步</div><div class="big num">${up}</div><div class="tiny">${prettyDate(state.viewDate)}</div></div>`;
  }

  function renderChips() {
    const items = [
      ["all", "全校"], ["low", "低年班"], ["high", "高年班"]
    ].concat(classList().map(c => [c, c]));
    $("classChips").innerHTML = items.map(([id, lab]) =>

      if (!matchFilter(r.klass) || !passQ(r.klass, r.no, lookupName(r.klass, r.no))) return;
      if (!latest[keyOf(r.klass, r.no)] && !roster.some(s => s.klass === r.klass && s.no === r.no)) {

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function toPlainLines(s) {
    return String(s || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
  }
  function titleHtml(s) {
    return escapeHtml(toPlainLines(s)).replace(/\n/g, "<br>");
  }
  function withLabel(kind, obj) {
    if (!obj) return obj;
    const patch = ((layout.labels || {})[kind] || {})[obj.id] || {};
    const out = Object.assign({}, obj);
    if (patch.title != null && String(patch.title).trim()) out.title = patch.title;
    if (patch.blurb != null) out.blurb = patch.blurb;
    return out;
  }
  function orderedList(all, order) {
    const byId = Object.fromEntries(all.map(x => [x.id, x]));
    const seen = new Set();
    const out = [];
    (order || []).forEach(id => {
      if (byId[id] && !seen.has(id)) { out.push(byId[id]); seen.add(id); }
    });
    all.forEach(x => { if (!seen.has(x.id)) out.push(x); });
    return out;
  }
  function orderedAreas() { return orderedList(AREAS, layout.areas).map(a => withLabel("areas", a)); }
  function orderedFolders(areaId) {
    const list = FOLDERS.filter(f => f.area === areaId);
    return orderedList(list, (layout.folders && layout.folders[areaId]) || []).map(f => withLabel("folders", f));
  }
  function orderedItems(subjectId) {
    const list = ITEMS.filter(x => x.subject === subjectId);
    return orderedList(list, (layout.items && layout.items[subjectId]) || []).map(it => withLabel("items", it));
  }
  function areaById(id) { return withLabel("areas", AREAS.find(a => a.id === id)); }
  function folderById(id) { return withLabel("folders", FOLDERS.find(f => f.id === id)); }
  function areaHref(a) {
    if (a.subject) return "#/s/" + a.subject;
    return "#/a/" + a.id;
  }
  function applyLayout(data) {
    if (!data || typeof data !== "object") return;
    if (Array.isArray(data.areas)) layout.areas = data.areas.slice();
    if (data.folders && typeof data.folders === "object") layout.folders = data.folders;
    if (data.items && typeof data.items === "object") layout.items = data.items;
    if (data.labels && typeof data.labels === "object") {
      layout.labels = {
        areas: Object.assign({}, data.labels.areas || {}),
        folders: Object.assign({}, data.labels.folders || {}),
        items: Object.assign({}, data.labels.items || {})
      };
    }
  }
  async function loadLayout() {

  function driveFileId(url) {
    const s = String(url || "");
    const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/) ||
      s.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
    return m ? m[1] : "";
  }
  function beanNorm(raw) {
    const klass = String(raw.klass || raw.class || "").trim().toUpperCase().replace(/\s+/g, "");
    const no = String(parseInt(String(raw.no || "").replace(/[^\d]/g, ""), 10));
    const day = String(raw.day || "").trim();
    const fileId = raw.fileId || driveFileId(raw.photo || raw.url || raw.src || "");
    const src = String(raw.src || "");
    return {
      klass, no: no === "NaN" ? "" : no,
      day, stage: String(raw.stage || "").trim(),
      note: String(raw.note || "").trim(),
      photo: String(raw.photo || ""),
      src: src.indexOf("data:") === 0 ? src : "",
      fileId, ts: Number(raw.ts || 0)
    };
  }
  function beanThumb(r) {
    if (r && r.src && r.src.indexOf("data:") === 0) return r.src;
    return "";
  }
  function beanHasPhoto(r) { return !!(r && (r.fileId || beanThumb(r))); }
  function fillBeanImages(root) {
    const imgs = Array.from((root || document).querySelectorAll("img[data-id]")).filter(img => {
      const id = img.getAttribute("data-id");
      return id && !(img.src && img.src.indexOf("data:") === 0);
    });
    let i = 0;
    const workers = 3;
    function next() {
      if (i >= imgs.length) return;
      const img = imgs[i++];
      const id = img.getAttribute("data-id");
      const full = img.getAttribute("data-full") === "1";
      const cb = "bimg_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      const q = new URLSearchParams({
        token: SCORE_TOKEN,
        view: "imgjson",
        op: "imgjson",
        activity: "家中種綠豆",
        kind: "beanlog",
        id: id,
        thumb: full ? "0" : "1",
        callback: cb,
        t: String(Date.now())
      });
      scriptJsonp(SCORE_URL + "?" + q.toString(), cb).then(data => {
        if (data && data.src && data.src.indexOf("data:") === 0) {
          img.src = data.src;
          const recs = state.beanRecords || [];
          recs.forEach(r => { if (r.fileId === id && !r.src) r.src = data.src; });
        } else {
          img.style.background = "#e8f5e9";
        }
      }).catch(function () { img.style.background = "#e8f5e9"; }).then(next);
    }
    for (let w = 0; w < workers; w++) next();
  }
  function beanName(r) { return lookupName(r.klass, r.no) || "名單以外"; }
  function beanPassQ(r) {
    const q = state.beanQ.trim().toLowerCase();
    if (!q) return true;
    return (r.klass + " " + r.no + "號 " + beanName(r) + " " + r.day + " " + r.stage).toLowerCase().indexOf(q) >= 0;
  }
  function beanMatch(r) {
    if (state.beanFilter !== "all" && r.klass !== state.beanFilter) return false;
    if (state.beanDay !== "all" && r.day !== state.beanDay) return false;
    return beanPassQ(r);
  }
  function beanLive(rows) {
    const map = {};
    (rows || []).forEach(r => {
      if (!r.klass || !r.no || !r.day) return;
      const k = r.klass + "\t" + r.no + "\t" + r.day;
      const cur = map[k];
      if (!cur || r.ts >= cur.ts) map[k] = r;
    });
    return Object.keys(map).map(k => map[k]);
  }
  async function fetchBeanGviz() {
    const cb = "bean_gviz_" + Date.now();
    const tqx = encodeURIComponent("out:json;responseHandler:" + cb);
    const src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=" + tqx + "&sheet=" + encodeURIComponent("家中種綠豆") +
      "&headers=1&t=" + Date.now();
    const data = await scriptJsonp(src, cb);
    if (!data || data.status === "error" || !data.table) return [];
    const cols = (data.table.cols || []).map(c => String(c.label || c.id || ""));
    const idx = (name) => cols.indexOf(name);
    const iClass = idx("班別"), iNo = idx("學號"), iDay = idx("第幾日");
    const iStage = idx("生長情況"), iNote = idx("觀察"), iUrl = idx("相片連結");
    const out = [];
    (data.table.rows || []).forEach(row => {
      const klass = String(gvizCell(row, iClass) || "").trim().toUpperCase();
      const no = String(parseInt(String(gvizCell(row, iNo)), 10));
      const day = String(gvizCell(row, iDay) || "").trim();
      const url = String(gvizCell(row, iUrl) || "");
      if (!klass || !no || no === "NaN") return;
      out.push(beanNorm({
        klass, no, day,
        stage: iStage >= 0 ? gvizCell(row, iStage) : "",
        note: iNote >= 0 ? gvizCell(row, iNote) : "",
        photo: url
      }));
    });
    return out;
  }
  async function beanJsonp(extra) {

    const q = new URLSearchParams(Object.assign({

  async function loadBean() {
    $("beanStatus").textContent = "正在讀取相片…";
    const tries = [
      { view: "photosjson" },
      { activity: "家中種綠豆", op: "listall" },
      { activity: "家中種綠豆", kind: "beanlog", op: "list", class: "2A", no: "1" }
    ];
    let items = [];
    for (let i = 0; i < tries.length; i++) {
      try {
        const data = await beanJsonp(tries[i]);
        if (data && data.ok && Array.isArray(data.items) && data.items.length) {
          items = data.items;
          if (tries[i].op === "list") {
            const more = ["2B", "2C", "1A", "1B", "4A", "4B", "4C"];
            for (let c = 0; c < more.length; c++) {
              try {
                const extra = await beanJsonp({ activity: "家中種綠豆", kind: "beanlog", op: "list", class: more[c], no: "1" });
                if (extra && extra.ok && extra.items) items = items.concat(extra.items);
              } catch (e2) {}
            }
          }
          break;
        }
      } catch (e) {}
    }
    if (items.length) {
      state.beanRecords = items.map(beanNorm);
    } else {
      try { state.beanRecords = await fetchBeanGviz(); }
      catch (e) { state.beanRecords = []; }
    }
    const n = state.beanRecords.filter(beanHasPhoto).length;
    const total = beanLive(state.beanRecords).length;

      ? ("已更新　" + total + " 筆紀錄，" + n + " 張可顯示相片")
      : "暫時未有紀錄。若剛儲存，請等數秒再撳重新整理。";
    renderBean();
  }

    const missing = roster.filter(s => !done[s.klass + "\t" + s.no]);
    $("beanStats").innerHTML = `
      <div class="stat ok"><div class="lab">相片</div><div class="big num">${photos.length}</div><div class="tiny">一目了然</div></div>
      <div class="stat"><div class="lab">已交</div><div class="big num">${Object.keys(done).length}</div><div class="tiny">至少一張相片</div></div>
      <div class="stat warn"><div class="lab">未交</div><div class="big num">${missing.length}</div><div class="tiny">對照 ${roster.length} 人名單</div></div>
      <div class="stat"><div class="lab">日子</div><div class="big num">${state.beanDay === "all" ? "全部" : state.beanDay.replace("第","").replace("日","")}</div><div class="tiny">${state.beanFilter === "all" ? "全校" : state.beanFilter}</div></div>`;
  }
  function openBeanLight(r) {
    const src = beanThumb(r);
    const name = beanName(r);
    $("beanLight").innerHTML = `
      <img src="${esc(src)}" alt="" data-id="${esc(r.fileId || "")}" data-full="1">
      <div class="cap">${esc(name)}　${esc(r.klass)}　${esc(r.no)}號<br>${esc(r.day)}${r.stage ? "　" + esc(r.stage) : ""}${r.note ? "<br>" + esc(r.note) : ""}<br><span style="opacity:.8">撳空白處關閉</span></div>`;
    $("beanLight").classList.remove("hidden");
    fillBeanImages($("beanLight"));
  }
  function renderBean() {
    if (!$("beanMain")) return;
    renderBeanChips();
    renderBeanStats();
    document.querySelectorAll("#beanTabs button").forEach(b => b.classList.toggle("on", b.getAttribute("data-btab") === state.beanTab));
    const live = beanLive(state.beanRecords).filter(beanMatch);
    if (state.beanTab === "miss") {
      const done = {};
      beanLive(state.beanRecords).forEach(r => {
        if (!beanHasPhoto(r)) return;
        if (state.beanFilter !== "all" && r.klass !== state.beanFilter) return;
        done[r.klass + "\t" + r.no] = true;
      });
      const missing = rosterStudents(state.beanFilter === "all" ? "all" : state.beanFilter)
        .filter(s => !done[s.klass + "\t" + s.no] && beanPassQ({ klass: s.klass, no: s.no, day: "", stage: "" }));
      $("beanMain").innerHTML = `<h2 class="h2">未交　${missing.length}</h2>
        <div class="pills">${missing.map(s => `<span class="pill">${esc(s.klass)} ${esc(s.no)}號 ${esc(s.name)}</span>`).join("") || `<p class="empty">這範圍已經全部交過相片。</p>`}</div>`;
      return;
    }
    const photos = live.slice().sort((a, b) =>
      a.klass.localeCompare(b.klass, "zh-Hant") || Number(a.no) - Number(b.no) || String(a.day).localeCompare(String(b.day))
    );
    if (!photos.length) {
      $("beanMain").innerHTML = `<p class="empty">暫時未有紀錄。請學生儲存後，撳「重新整理」。</p>`;
      return;
    }
    $("beanMain").innerHTML = `<h2 class="h2">全部相片　${photos.length}</h2>
      <div class="photo-wall">${photos.map((r, i) => `
        <button class="photo-card" type="button" data-bean="${i}">
          <img src="${esc(beanThumb(r))}" alt="" data-id="${esc(r.fileId || "")}" style="${beanThumb(r) || r.fileId ? "" : "min-height:140px;background:#e8f5e9"}">
          <div class="cap"><div class="who">${esc(beanName(r))}</div>
          <div class="meta">${esc(r.klass)}　${esc(r.no)}號　${esc(r.day)}${r.stage ? "　" + esc(r.stage) : ""}${r.fileId || beanThumb(r) ? "" : "　相片載入需更新成績程式"}</div></div>
        </button>`).join("")}</div>`;
    $("beanMain")._photos = photos;
    fillBeanImages($("beanMain"));
  };
  function renderLogin() {
    hideDash();
    $("lockBtn").classList.add("hidden");
    $("shell").innerHTML = `
      ${charsHtml()}
      <div class="note">
        此頁只供教師查看成績。請輸入密碼。
        <div class="pin-row">
          <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" />
        </div>
        <button class="pin-go" id="pinGo" type="button">進入後台</button>
        <p class="gate-msg" id="gateMsg"></p>
        <p style="margin:12px 0 0"><a class="btn-back" href="${new URLSearchParams(location.search).get("from")==="beanlog" ? "../beanlog/" : "index.html"}">返回學生輸入頁</a></p>
      </div>`;
    const pin = $("pin");
    if (pin) pin.focus();
  }
  function renderHome() {
    hideDash();
    const areas = orderedAreas();
    $("shell").innerHTML = `
      ${charsHtml()}
      <p class="note">請選擇分類。準小一入學適合五至六歲。數學、體育、科學、資訊科技入面再按年級揀教材。入去可查看已交／未交。</p>
      <div class="grid">${cardsHtml(areas, areaHref)}</div>`;
  }
  function renderArea(id) {
    hideDash();
    const area = areaById(id);
    if (!area) return renderHome();
    if (area.subject) return renderSubject(area.subject);
    const folders = orderedFolders(id);
    $("shell").innerHTML = `
      <div class="bar"><a class="btn-back" href="#/">← 返回目錄</a></div>
      <h3 class="sec">${area.emoji} ${escapeHtml(toPlainLines(area.title))}</h3>
      ${folders.length
        ? `<p class="note">請選擇年級或分類。</p><div class="grid">${cardsHtml(folders, f => "#/s/" + f.id)}</div>`
        : `<p class="note">此部分暫時沒有成績。</p>`}`;
  }
  function renderSubject(id) {
    hideDash();
    const s = folderById(id);
    if (!s) {
      const area = areaById(id);
      if (area) return renderArea(id);
      return renderHome();
    }
    const items = orderedItems(id);
    $("shell").innerHTML = `
      <div class="bar"><a class="btn-back" href="#/">← 返回目錄</a></div>
      <h3 class="sec">${s.emoji} ${escapeHtml(toPlainLines(s.title))}</h3>
      ${items.length
        ? `<p class="note">請選擇遊戲或活動，查看成績。</p><div class="grid">${cardsHtml(items, it => "#/i/" + it.id)}</div>`
        : `<p class="note">此部分暫時沒有成績。</p>`}`;
  }
  function renderItem(id) {
    const it = withLabel("items", ITEMS.find(x => x.id === id));
    if (!it) return renderHome();
    if (it.id === "grip") { showDash(); return; }
    if (it.id === "beanlog") { showBeanDash(); return; }
    hideDash();
    $("shell").innerHTML = `
      <div class="bar"><a class="btn-back" href="#/s/${it.subject}">← 返回</a></div>
      <h3 class="sec">${it.emoji} ${escapeHtml(toPlainLines(it.title))}</h3>
      <p class="note">${it.noScore
        ? "此項目沒有學生成績紀錄。"
        : "此遊戲成績頁即將推出。而家請先查看手握力龍虎榜。"}</p>`;
  }
  function route() {
    if (!isIn()) { renderLogin(); return; }
    const hash = (location.hash || "#/").replace(/^#/, "");
    const parts = hash.split("/").filter(Boolean);
    if (parts[0] === "a" && parts[1]) return renderArea(parts[1]);
    if (parts[0] === "s" && parts[1]) {
      const sid = parts[1] === "world" ? "lang" : (parts[1] === "p4-pe" ? "pe" : parts[1]);
      if (!folderById(sid) && areaById(sid)) return renderArea(sid);
      return renderSubject(sid);
    }
    if (parts[0] === "i" && parts[1]) return renderItem(parts[1]);
    renderHome();
  }
  function tryPin() {
    const pin = $("pin");
    const msg = $("gateMsg");
    if (!pin) return;
    if (pin.value !== TEACHER_PIN) {
      if (msg) msg.textContent = "密碼不正確";
      pin.value = "";
      pin.focus();
      return;
    }
    enterApp();
  }
  function enterApp() {
    document.body.classList.add("in");
    try { sessionStorage.setItem("grip-admin", "1"); } catch (e) {}
    $("lockBtn").classList.remove("hidden");
    route();
  }
  function lock() {
    document.body.classList.remove("in");
    try { sessionStorage.removeItem("grip-admin"); } catch (e) {}
    hideDash();
    if (location.hash && location.hash !== "#/") location.hash = "#/";
    renderLogin();
  }

  async function boot() {
    $("dateLabel").textContent = "今日：" + prettyDate(state.today);
    try {
      const res = await fetch("roster.json?t=" + Date.now(), { cache: "no-store" });
      if (res.ok) ingestRoster(await res.json());
    } catch (e) {}
    $("lockBtn").onclick = lock;
    $("dashLock").onclick = lock;
    $("beanLock").onclick = lock;
    $("beanReload").onclick = () => loadBean();
    $("beanTabs").onclick = (e) => {
      const b = e.target.closest("button[data-btab]");
      if (!b) return;
      state.beanTab = b.getAttribute("data-btab");
      renderBean();
    };
    $("beanClassChips").onclick = (e) => {
      const b = e.target.closest("button[data-bclass]");
      if (!b) return;
      state.beanFilter = b.getAttribute("data-bclass");
      renderBean();
    };
    $("beanDayChips").onclick = (e) => {
      const b = e.target.closest("button[data-bday]");
      if (!b) return;
      state.beanDay = b.getAttribute("data-bday");
      renderBean();
    };
    $("beanQ").addEventListener("input", () => {
      state.beanQ = $("beanQ").value;
      renderBean();
    });
    $("beanMain").onclick = (e) => {
      const card = e.target.closest("button[data-bean]");
      if (!card) return;
      const photos = $("beanMain")._photos || [];
      const r = photos[Number(card.getAttribute("data-bean"))];
      if (r) openBeanLight(r);
    };
    $("beanLight").onclick = () => $("beanLight").classList.add("hidden");
    $("shell").addEventListener("click", (e) => {
      if (e.target.id === "pinGo") tryPin();
    });
    $("shell").addEventListener("keydown", (e) => {
      if (e.target.id === "pin" && e.key === "Enter") { e.preventDefault(); tryPin(); }
    });
    window.addEventListener("hashchange", () => { if (isIn()) route(); });
    $("reloadBtn").onclick = () => loadBoard();
    $("csvBtn").onclick = exportCsv;
    $("tabs").onclick = (e) => {
      const b = e.target.closest("button[data-tab]");
      if (!b) return;
      state.tab = b.getAttribute("data-tab");
      render();
    };
    $("classChips").onclick = (e) => {
      const b = e.target.closest("button[data-filter]");
      if (!b) return;
      state.filter = b.getAttribute("data-filter");
      if (classList().indexOf(state.filter) >= 0) {
        state.personClass = state.filter;
        if (state.tab === "today") state.tab = "today";
      }
      render();
    };
    $("q").addEventListener("input", () => {
      state.q = $("q").value;
      if (state.q && state.filter === "all" && state.tab === "today") {}
      render();
    });
    $("sortBtn").onclick = () => {
      state.sort = state.sort === "kg" ? "no" : "kg";
      render();
    };
    $("dateChips").onclick = (e) => {
      const b = e.target.closest("button[data-date]");
      if (!b) return;
      state.viewDate = b.getAttribute("data-date");
      render();
    };
    $("main").onclick = (e) => {
      const meter = e.target.closest("button[data-filter]");
      if (meter && meter.closest(".meters")) {
        state.filter = meter.getAttribute("data-filter");
        render();
        return;
      }
      const p = e.target.closest("button[data-person]");
      if (p) {
        const parts = p.getAttribute("data-person").split(":");
        state.personClass = parts[0];
        state.personNo = parts[1];
        state.tab = "person";
        state.filter = parts[0];
        render();
        return;
      }
      const b = e.target.closest("button[data-del]");
      if (b) teacherDelete(b.getAttribute("data-class"), b.getAttribute("data-no"), b.getAttribute("data-del") === "all");
    };
    $("main").onchange = (e) => {
      if (e.target.id === "pClass") {
        state.personClass = e.target.value;
        const nos = Object.keys(state.roster[state.personClass] || {});
        state.personNo = nos.sort((a, b) => Number(a) - Number(b))[0] || "";
        render();
      }
      if (e.target.id === "pNo") {
        state.personNo = e.target.value;
        render();
      }
    };
    await loadLayout();
    try {
      if (sessionStorage.getItem("grip-admin") === "1") enterApp();
      else renderLogin();
    } catch (e) { renderLogin(); }
  }
  boot();
</script>
</body>
</html>
