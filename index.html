<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="張老師教學資源" />
  <meta name="format-detection" content="telephone=no" />
  <title>佛教志蓮小學　張老師教學資源</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #2f7d32;
      --green-dark: #1b5e20;
      --yellow: #f4d35e;
      --sky: #7ec8e3;
      --sky2: #c8f0c0;
      --card: #fffef6;
      --ink: #1d2b1f;
      --muted: #3d5c40;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body {
      margin: 0; min-height: 100%; min-height: 100dvh;
      font-family: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
      color: var(--ink);
      background: linear-gradient(#8fd3f0, #c8f0c0) fixed;
    }
    header {
      background: var(--green);
      color: #fff;
      text-align: center;
      padding: max(14px, env(safe-area-inset-top)) 16px 16px;
      box-shadow: 0 8px 0 var(--green-dark);
    }
    header .school { margin: 0; font-size: 15px; font-weight: 700; color: var(--yellow); }
    header h1 { margin: 6px 0 0; font-size: clamp(22px, 6vw, 26px); font-weight: 900; letter-spacing: .04em; }
    header p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; opacity: .95; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px calc(48px + env(safe-area-inset-bottom)); }
    .chars {
      display: flex; justify-content: center; gap: 24px; margin: 8px 0 18px;
    }
    .chars img { height: 88px; width: auto; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
    .note {
      background: var(--card);
      border: 5px solid var(--green);
      border-radius: 22px;
      padding: 14px 16px;
      margin-bottom: 18px;
      box-shadow: 0 6px 0 var(--green-dark);
      line-height: 1.55;
      font-weight: 700;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
      gap: 14px;
    }
    a.card, .item {
      display: block; text-decoration: none; color: inherit;
      background: var(--card);
      border: 5px solid #c5dcc6;
      border-radius: 24px;
      padding: 16px 16px 14px;
      box-shadow: 0 6px 0 #8fbf92;
      cursor: pointer;
      min-height: 44px;
    }
    a.card:active, .item:active { transform: translateY(2px); box-shadow: 0 4px 0 #8fbf92; }
    a.card .emoji { font-size: 42px; line-height: 1; }
    a.card h2, .item h2 { margin: 8px 0 4px; font-size: 22px; color: var(--green-dark); }
    a.card p, .item p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; }
    .empty {
      background: var(--card);
      border: 5px dashed #9ccc65;
      border-radius: 24px;
      padding: 28px 18px;
      text-align: center;
      font-weight: 700;
      color: var(--muted);
    }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    button, .btn {
      appearance: none; border: 0; font: inherit; font-weight: 900;
      border-radius: 16px; padding: 12px 16px; cursor: pointer;
      text-decoration: none; display: inline-block; text-align: center;
    }
    .btn-back { background: #fff; color: var(--green-dark); border: 4px solid var(--green); min-height: 44px; }
    .btn-play {
      background: var(--green); color: #fff; font-size: 20px; width: 100%;
      box-shadow: 0 6px 0 var(--green-dark); margin: 8px 0 12px;
      min-height: 52px; line-height: 1.3; padding: 16px;
    }
    .btn-dl {
      background: #1565c0; color: #fff; font-size: 18px; width: 100%;
      box-shadow: 0 6px 0 #0d47a1; margin: 0 0 16px;
      min-height: 52px; line-height: 1.3; padding: 16px;
    }
    .qrbox {
      background: #fff; border-radius: 24px; border: 5px solid var(--yellow);
      padding: 14px; text-align: center; margin-bottom: 14px;
    }
    .qrbox img { width: min(100%, 280px); height: auto; }
    .qrbox p { margin: 8px 0 0; font-weight: 700; font-size: 14px; }
    .label-bit { margin: 4px 0 8px; font-size: 15px; font-weight: 900; color: var(--green-dark); }
    .url-line {
      text-align: center; font-size: 13px; font-weight: 700; color: var(--muted);
      margin: -4px 0 14px; word-break: break-all;
    }
    .basics { margin-bottom: 8px; }
    footer {
      text-align: center; padding: 8px 16px 28px; color: var(--green-dark);
      font-size: 13px; font-weight: 700; line-height: 1.6;
    }
    h3.sec { margin: 0 0 12px; font-size: 24px; color: var(--green-dark); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <p class="school">佛教志蓮小學</p>
    <h1>張老師教學資源</h1>
    <p>供學生及家長使用。開始遊戲或測驗前，請填寫班別及學號，無須填寫姓名。</p>
  </header>
  <main class="wrap" id="app"></main>
  <footer>
    本站不會收集姓名、電話或照片。<br>
    只記錄班別、學號及成績，供教師批改，不會向其他同學公開。<br>
    本站內容適合小學生閱讀。
  </footer>
  <script>
    const SUBJECTS = [
      { id: "p2-sci", title: "二年級科學", emoji: "🌱", blurb: "觀察、實驗、溫習課本" },
      { id: "p4-sci", title: "四年級科學", emoji: "🔬", blurb: "教材即將推出" },
      { id: "p4-math", title: "四年級數學", emoji: "➕", blurb: "乘數表練習" },
      { id: "p4-pe", title: "四年級體育", emoji: "⚽", blurb: "教材即將推出" },
      { id: "p4-ict", title: "四年級資訊科技", emoji: "💻", blurb: "教材即將推出" },
      { id: "p5-ict", title: "五年級資訊科技", emoji: "🖥️", blurb: "教材即將推出" },
      { id: "world", title: "環遊世界", emoji: "🌍", blurb: "外語小學堂：日文、法文、韓文" }
    ];

    const ITEMS = [
      {
        id: "jump",
        subject: "p2-sci",
        type: "game",
        title: "小小發明家跳跳關",
        description: "二年級科學　《科學新領域》課本 二上。單元一　動物和植物：第 1 課 生物和非生物、第 2 課 觀察動物、第 3 課 動手種植物。單元二　人與環境：第 4 課 愛護環境。單元三　變幻的天氣：第 5 課 天氣與我、第 6 課 四季的變化。",
        play: "https://cheungsiredu.github.io/chilin-jump-game/",
        qr: "qrs/jump.png",
        download: "downloads/chilin-jump-game.zip",
        downloadName: "小小發明家跳跳關.zip"
      },
      {
        id: "times",
        subject: "p4-math",
        type: "game",
        title: "乘數表小遊戲",
        description: "四年級數學　乘數表練習。可練習二至九的乘數表：快速答題、四揀一、填一份乘數表、一分鐘挑戰。",
        play: "https://cheungsiredu.github.io/education/times/",
        qr: "qrs/times.png"
      },
      {
        id: "jp",
        subject: "world",
        type: "game",
        title: "日文小學堂",
        description: "環遊世界課程　外語體驗。聽廣東話解釋、聽日文示範，然後用麥克風朗讀。適用於 iPad、iPhone 及電腦。共 20 題。",
        play: "https://cheungsiredu.github.io/education/languages/jp.html",
        qr: "qrs/lang-jp.png"
      },
      {
        id: "fr",
        subject: "world",
        type: "game",
        title: "法文小學堂",
        description: "環遊世界課程　外語體驗。聽廣東話解釋、聽法文示範，然後用麥克風朗讀。適用於 iPad、iPhone 及電腦。共 20 題。",
        play: "https://cheungsiredu.github.io/education/languages/fr.html",
        qr: "qrs/lang-fr.png"
      },
      {
        id: "ko",
        subject: "world",
        type: "game",
        title: "韓文小學堂",
        description: "環遊世界課程　外語體驗。聽廣東話解釋、聽韓文示範，然後用麥克風朗讀。適用於 iPad、iPhone 及電腦。共 20 題。",
        play: "https://cheungsiredu.github.io/education/languages/ko.html",
        qr: "qrs/lang-ko.png"
      }
    ];

    function $(id) { return document.getElementById(id); }

    function route() {
      const hash = (location.hash || "#/").replace(/^#/, "");
      const parts = hash.split("/").filter(Boolean);
      if (parts[0] === "s" && parts[1]) return renderSubject(parts[1]);
      if (parts[0] === "i" && parts[1]) return renderItem(parts[1]);
      renderHome();
    }

    function renderHome() {
      document.title = "佛教志蓮小學　張老師教學資源";
      $("app").innerHTML = `
        <div class="chars">
          <img src="assets/boy.png" alt="小志">
          <img src="assets/girl.png" alt="小蓮">
        </div>
        <p class="note">請選擇年級及科目。遊戲及小測驗均可在電腦、平板電腦或智能電話遊玩。每項教材均設有連結、二維碼及成績紀錄。</p>
        <div class="grid">
          ${SUBJECTS.map(s => `
            <a class="card" href="#/s/${s.id}">
              <div class="emoji">${s.emoji}</div>
              <h2>${s.title}</h2>
              <p>${s.blurb}</p>
            </a>
          `).join("")}
        </div>
      `;
    }

    function itemBasics(it) {
      return `
        <div class="basics">
          <div class="item" style="cursor:default;margin-bottom:14px">
            <h2>${it.title}</h2>
            <p>${it.description || it.blurb || ""}</p>
          </div>
          <p class="label-bit">連結</p>
          <a class="btn btn-play" href="${it.play}">立即遊玩</a>
          <p class="url-line">${it.play}</p>
          ${it.download ? `<a class="btn btn-dl" href="${it.download}" download="${it.downloadName || ""}">下載遊戲檔案</a>` : ""}
          <p class="label-bit">二維碼</p>
          <div class="qrbox">
            <img src="${it.qr}" alt="二維碼：${it.title}">
            <p>請用相機掃描二維碼即可遊玩。</p>
          </div>
          <p class="label-bit">成績</p>
          <div class="note">
            開始前請填寫班別及學號（例如：4A、12）。無須填寫姓名。<br>
            完成後，分數會自動交給老師。本頁不顯示成績，學生及家長亦不會看到其他同學的分數。
          </div>
        </div>
      `;
    }

    function renderSubject(id) {
      const s = SUBJECTS.find(x => x.id === id);
      if (!s) return renderHome();
      const items = ITEMS.filter(x => x.subject === id);
      document.title = s.title + "　張老師教學資源";
      $("app").innerHTML = `
        <div class="bar"><a class="btn btn-back" href="#/">← 返回目錄</a></div>
        <h3 class="sec">${s.emoji} ${s.title}</h3>
        ${items.length ? items.map(it => itemBasics(it)).join("") : `<div class="empty">此部分教材即將推出。</div>`}
      `;
    }

    function renderItem(id) {
      const it = ITEMS.find(x => x.id === id);
      if (!it) return renderHome();
      const s = SUBJECTS.find(x => x.id === it.subject);
      document.title = it.title + "　張老師教學資源";
      $("app").innerHTML = `
        <div class="bar">
          <a class="btn btn-back" href="#/">← 返回目錄</a>
          <a class="btn btn-back" href="#/s/${it.subject}">← ${s ? s.title : "返回"}</a>
        </div>
        ${itemBasics(it)}
      `;
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
