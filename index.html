    function bytesToB64(bytes) {
      let s = "";
      const arr = bytes instanceof Uint8Array ? bytes : new TextEncoder().encode(bytes);
      const chunk = 0x8000;
      for (let i = 0; i < arr.length; i += chunk) {
        s += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
      }
      return btoa(s);
    }

    async function unlockEdit() {
      if (ghToken) return;
      const res = await fetch("gate.json", { cache: "no-store" });
      if (!res.ok) throw new Error("未能開啟編輯");
      const gate = await res.json();
      const salt = Uint8Array.from(atob(gate.salt), c => c.charCodeAt(0));
      const enc = Uint8Array.from(atob(gate.data), c => c.charCodeAt(0));
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode("chilin"), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: gate.iter, hash: "SHA-256" }, key, 256);
      const k = new Uint8Array(bits);
      const raw = new Uint8Array(enc.length);
      for (let i = 0; i < enc.length; i++) raw[i] = enc[i] ^ k[i % k.length];
      const token = new TextDecoder().decode(raw).replace(/\0+$/g, "").trim();
      if (!/^gh[pous]_/.test(token)) throw new Error("未能開啟編輯");
      ghToken = token;
      sessionStorage.setItem("edu-gh", token);
    }

    async function ghGet(path) {
      const res = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/" + path, {
        headers: { Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json" }
      });
      if (res.status === 404) return null;
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "讀取失敗");
      return data;
    }

    async function saveLayout() {
      localStorage.setItem("edu-layout", JSON.stringify(layout));
      if (!ghToken) {
        try { await unlockEdit(); } catch (_) { return; }
      }
      const text = JSON.stringify(layout, null, 2) + "\n";
      const existing = await ghGet("card-order.json") || await ghGet("layout.json");
      const res = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/card-order.json", {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + ghToken,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "更新教學資源排版",
          content: bytesToB64(text),
          sha: existing && existing.sha,
          branch: "main"
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "儲存失敗");
    }

    function applyLayout(data) {
      if (!data || typeof data !== "object") return;
      if (Array.isArray(data.areas)) layout.areas = data.areas.slice();
      if (data.folders && typeof data.folders === "object") layout.folders = data.folders;
      if (data.items && typeof data.items === "object") layout.items = data.items;
      if (data.labels && typeof data.labels === "object") {
        layout.labels = {
          areas: Object.assign({}, data.labels.areas || {}),
          folders: Object.assign({}, data.labels.folders || {}),
          items: Object.assign({}, data.labels.items || {})
        };
      }
      if (Array.isArray(data.subjects) && !Array.isArray(data.areas)) {
        const byFolder = Object.fromEntries(FOLDERS.map(f => [f.id, f]));
        const grouped = {};
        for (const id of data.subjects) {
          const f = byFolder[id];
          if (!f) continue;
          grouped[f.area] = grouped[f.area] || [];
          if (!grouped[f.area].includes(id)) grouped[f.area].push(id);
        }
        layout.folders = grouped;
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toPlainLines(s) {
      return String(s || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
    }

    function titleHtml(s) {
      return escapeHtml(toPlainLines(s)).replace(/\n/g, "<br>");
    }

    function withLabel(kind, obj) {
      if (!obj) return obj;
      const patch = ((layout.labels || {})[kind] || {})[obj.id] || {};
      const out = Object.assign({}, obj);
      if (patch.title != null && String(patch.title).trim()) out.title = patch.title;
      if (patch.blurb != null) {
        out.blurb = patch.blurb;
        if (!obj.description || obj.description === obj.blurb) out.description = patch.blurb;
      }
      return out;
    }

    function setLabel(kind, id, fields) {
      const labels = {
        areas: Object.assign({}, (layout.labels || {}).areas || {}),
        folders: Object.assign({}, (layout.labels || {}).folders || {}),
        items: Object.assign({}, (layout.labels || {}).items || {})
      };
      labels[kind] = Object.assign({}, labels[kind], {
        [id]: Object.assign({}, labels[kind][id] || {}, fields)
      });
      if (kind === "areas" && id === "lang") {
        labels.folders = Object.assign({}, labels.folders, {
          lang: Object.assign({}, labels.folders.lang || {}, fields)
        });
      }
      if (kind === "folders" && id === "lang") {
        labels.areas = Object.assign({}, labels.areas, {
          lang: Object.assign({}, labels.areas.lang || {}, fields)
        });
      }
      layout.labels = labels;
    }

    function orderedList(all, order) {
      const byId = Object.fromEntries(all.map(x => [x.id, x]));
      const seen = new Set();
      const out = [];
      for (const id of order || []) {
        if (byId[id] && !seen.has(id)) { out.push(byId[id]); seen.add(id); }
      }
      for (const x of all) if (!seen.has(x.id)) out.push(x);
      return out;
    }

    function orderedAreas() {
      return orderedList(AREAS, layout.areas).map(a => withLabel("areas", a));
    }

    function orderedFolders(areaId) {
      const list = FOLDERS.filter(f => f.area === areaId);
      return orderedList(list, (layout.folders && layout.folders[areaId]) || []).map(f => withLabel("folders", f));
    }

    function areaById(id) { return withLabel("areas", AREAS.find(a => a.id === id)); }
    function folderById(id) { return withLabel("folders", FOLDERS.find(f => f.id === id)); }
    function areaHref(a) {
      if (a.href) return a.href;
      if (a.subject) return "#/s/" + a.subject;
      return "#/a/" + a.id;
    }

    function orderedItems(subjectId) {
      const list = ITEMS.filter(x => x.subject === subjectId);
      const byId = Object.fromEntries(list.map(it => [it.id, it]));
      const order = (layout.items && layout.items[subjectId]) || [];
      const seen = new Set();
      const out = [];
      for (const id of order) {
        if (byId[id] && !seen.has(id)) { out.push(byId[id]); seen.add(id); }
      }
      for (const it of list) if (!seen.has(it.id)) out.push(it);
      return out.map(it => withLabel("items", it));
    }

    function cardByKind(kind, id) {
      if (kind === "areas") return areaById(id);
      if (kind === "folders") return folderById(id);
      return withLabel("items", ITEMS.find(x => x.id === id));
    }

    function moveInList(arr, fromId, toId) {
      const a = arr.indexOf(fromId);
      const b = arr.indexOf(toId);
      if (a < 0 || b < 0 || a === b) return arr;
      const next = arr.slice();
      const [item] = next.splice(a, 1);
      next.splice(b, 0, item);
      return next;
    }

    function areaIds() { return orderedAreas().map(a => a.id); }
    function folderIds(areaId) { return orderedFolders(areaId).map(f => f.id); }
    function itemIds(subjectId) { return orderedItems(subjectId).map(it => it.id); }

    function idsFor(kind, scopeId) {
      if (kind === "areas") return areaIds();
      if (kind === "folders") return folderIds(scopeId);
      return itemIds(scopeId);
    }

    function writeOrder(kind, scopeId, next) {
      if (kind === "areas") layout.areas = next;
      else if (kind === "folders") layout.folders = Object.assign({}, layout.folders, { [scopeId]: next });
      else layout.items = Object.assign({}, layout.items, { [scopeId]: next });
    }

    function readCardFields(kind, card) {
      const titleEl = card.querySelector("[data-field=title]");
      const blurbEl = card.querySelector("[data-field=blurb]");
      if (!titleEl || !blurbEl) return null;
      const title = titleEl.value.replace(/\s+$/g, "").replace(/^\s+/g, "");
      const blurb = blurbEl.value.replace(/\s+$/g, "").replace(/^\s+/g, "");
      if (!title) return { error: "名稱唔可以空白" };
      return {
        title: kind === "items" ? title.replace(/\n/g, "<br>") : title.replace(/\n/g, ""),
        blurb: blurb
      };
    }

    function labelsEqual(a, b) {
      return toPlainLines(a.title) === toPlainLines(b.title) && String(a.blurb || "") === String(b.blurb || "");
    }

    async function saveFields(kind, id, card, opts) {
      const next = readCardFields(kind, card);
      if (!next) return false;
      if (next.error) {
        if (!opts || !opts.quiet) toast(next.error);
        const cur = cardByKind(kind, id);
        if (cur) {
          const titleEl = card.querySelector("[data-field=title]");
          if (titleEl) titleEl.value = toPlainLines(cur.title);
        }
        return false;
      }
      const cur = cardByKind(kind, id) || {};
      if (labelsEqual(cur, next)) return false;
      setLabel(kind, id, { title: next.title, blurb: next.blurb });
      if (!opts || !opts.quiet) {
        try {
          await saveLayout();
          toast("已儲存");
        } catch (err) {
          toast(err.message);
        }
      }
      return true;
    }

    async function flushEdits() {
      const grid = document.querySelector(".grid");
      if (!grid) return;
      const kind = grid.getAttribute("data-kind");
      if (!kind) return;
      let changed = false;
      grid.querySelectorAll(".card[data-id]").forEach(card => {
        const id = card.getAttribute("data-id");
        const next = readCardFields(kind, card);
        if (!next || next.error) return;
        const cur = cardByKind(kind, id) || {};
        if (labelsEqual(cur, next)) return;
        setLabel(kind, id, { title: next.title, blurb: next.blurb });
        changed = true;
      });
      if (changed) await saveLayout();
    }

    async function shiftList(kind, scopeId, id, dir) {
      const card = document.querySelector('.card[data-id="' + id + '"]');
      if (card) await saveFields(kind, id, card, { quiet: true });
      const ids = idsFor(kind, scopeId);
      const i = ids.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= ids.length) return;
      const next = ids.slice();
      const [x] = next.splice(i, 1);
      next.splice(j, 0, x);
      writeOrder(kind, scopeId, next);
      route();
      try {
        await saveLayout();
        toast("排版已更新");
      } catch (err) {
        toast(err.message);
      }
    }

    async function dropList(kind, scopeId, fromId, toId) {
      if (!fromId || fromId === toId) return;
      try { await flushEdits(); } catch (_) {}
      writeOrder(kind, scopeId, moveInList(idsFor(kind, scopeId), fromId, toId));
      route();
      try {
        await saveLayout();
        toast("排版已更新");
      } catch (err) {
        toast(err.message);
      }
    }

    function bindGrid(kind, subjectId) {
      const grid = document.querySelector(".grid");
      if (!grid) return;
      grid.querySelectorAll("[data-id]").forEach(card => {
        const id = card.getAttribute("data-id");
        const obj = cardByKind(kind, id);
        const titleEl = card.querySelector("[data-field=title]");
        const blurbEl = card.querySelector("[data-field=blurb]");
        if (obj && titleEl) titleEl.value = toPlainLines(obj.title);
        if (obj && blurbEl) blurbEl.value = toPlainLines(obj.blurb);
        card.querySelectorAll("[data-move]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();
            shiftList(kind, subjectId, id, Number(btn.getAttribute("data-move")));
          });
        });
        card.querySelectorAll("[data-field]").forEach(field => {
          field.addEventListener("pointerdown", e => e.stopPropagation());
          field.addEventListener("mousedown", e => e.stopPropagation());
          field.addEventListener("click", e => e.stopPropagation());
          field.addEventListener("change", () => saveFields(kind, id, card));
        });
        if (!editing) return;
        card.addEventListener("dragstart", e => {
          if (e.target.closest("input, textarea, button, label")) {
            e.preventDefault();
            return;
          }
          dragId = id;
          card.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", () => {
          dragId = null;
          card.classList.remove("dragging");
        });
        card.addEventListener("dragover", e => {
          e.preventDefault();
          card.classList.add("drag-over");
        });
        card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
        card.addEventListener("drop", e => {
          e.preventDefault();
          card.classList.remove("drag-over");
          dropList(kind, subjectId, dragId, id);
        });
      });
    }

    function moveButtons(index, total) {
      if (!editing) return "";
      return `
        <div class="move-btns">
          <button type="button" data-move="-1" ${index === 0 ? "disabled" : ""}>上移</button>
          <button type="button" data-move="1" ${index === total - 1 ? "disabled" : ""}>下移</button>
        </div>
      `;
    }

    function route() {
      const hash = (location.hash || "#/").replace(/^#/, "");
      const parts = hash.split("/").filter(Boolean);
      if (parts[0] === "a" && parts[1]) return renderArea(parts[1]);
      if (parts[0] === "s" && parts[1]) {
        const sid = parts[1] === "world" ? "lang" : (parts[1] === "p4-pe" ? "pe" : parts[1]);
        if (!folderById(sid) && areaById(sid)) return renderArea(sid);
        return renderSubject(sid);
      }
      if (parts[0] === "i" && parts[1]) return renderItem(parts[1]);
      renderHome();
    }

    function renderCards(list, hrefFor, kind) {
      return list.map((s, i) => editing ? `
            <div class="card" data-id="${s.id}" draggable="true">
              <div class="emoji">${s.emoji || "🎮"}</div>
              <label class="edit-label">名稱</label>
              ${kind === "items"
                ? `<textarea class="edit-title" data-field="title" rows="3" maxlength="160"></textarea>`
                : `<input class="edit-title" data-field="title" type="text" maxlength="40" autocomplete="off">`}
              <label class="edit-label">說明</label>
              <textarea class="edit-blurb" data-field="blurb" rows="2" maxlength="120"></textarea>
              ${moveButtons(i, list.length)}
            </div>
          ` : `
            <a class="card" href="${hrefFor(s)}">
              <div class="emoji">${s.emoji || "🎮"}</div>
              <h2>${titleHtml(s.title)}</h2>
              <p>${escapeHtml(s.blurb || "")}</p>
            </a>
          `).join("");
    }

    function renderHome() {
      document.title = "佛教志蓮小學　張老師教學資源";
      const areas = orderedAreas();
      $("app").innerHTML = `
        <div class="chars">
          <img src="assets/boy.png" alt="小志">
          <img src="assets/girl.png" alt="小蓮">
        </div>
        <p class="note">${editing
          ? "編輯排版中：可以改名稱、改下面小字，或撳「上移／下移」。改動會儲存，所有裝置都會見到。"
          : "請選擇科目。數學、體育、科學、資訊科技入面再按年級揀教材。遊戲及小測驗均可在電腦、平板電腦或智能電話遊玩。"}</p>
        <div class="grid" data-kind="areas">
          ${renderCards(areas, areaHref, "areas")}
        </div>
      `;
      bindGrid("areas");
    }

    function renderArea(id) {
      const area = areaById(id);
      if (!area) return renderHome();
      if (area.href && !editing) { location.replace(area.href); return; }
      if (area.subject) return renderSubject(area.subject);
      const folders = orderedFolders(id);
      document.title = toPlainLines(area.title) + "　張老師教學資源";
      $("app").innerHTML = `
        <div class="bar"><a class="btn btn-back" href="#/">← 返回目錄</a></div>
        <h3 class="sec">${area.emoji} ${escapeHtml(toPlainLines(area.title))}</h3>
        ${folders.length ? `
          <p class="note">${editing
            ? "編輯排版中：可以改名稱、改下面小字，或撳「上移／下移」。改動會儲存，所有裝置都會見到。"
            : "請選擇年級或分類。"}</p>
          <div class="grid" data-kind="folders" data-scope="${id}">
            ${renderCards(folders, f => "#/s/" + f.id, "folders")}
          </div>
        ` : `<div class="empty">此部分教材即將推出。</div>`}
      `;
      bindGrid("folders", id);
    }

    function itemBasics(it) {
      return `
        <div class="basics">
          <div class="item" style="cursor:default;margin-bottom:14px">
            <h2>${titleHtml(it.title)}</h2>
            <p>${escapeHtml(it.description || it.blurb || "")}</p>
          </div>
          <p class="label-bit">連結</p>
          <a class="btn btn-play" href="${it.play}">${it.playLabel || "立即遊玩"}</a>
          <p class="url-line">${it.play}</p>
          ${it.download ? `<a class="btn btn-dl" href="${it.download}" download="${it.downloadName || ""}">${it.downloadLabel || "下載遊戲檔案"}</a>` : ""}
          <p class="label-bit">二維碼</p>
          <div class="qrbox${it.qrPoster ? " poster" : ""}">
            <img src="${it.qr}" alt="二維碼：${plainText(it.title)}">
            <p>${it.qrCaption || ("請用相機掃描二維碼即可" + (it.noScore ? "開啟" : "遊玩") + "。")}</p>
          </div>
          ${it.noScore ? "" : `<p class="label-bit">${it.scoreLabel || "成績"}</p>
          <div class="note">
            ${it.scoreNote || "開始前請填寫班別及學號（例如：4A、12）。無須填寫姓名。<br>完成後，分數會自動交給老師。本頁不顯示成績，學生及家長亦不會看到其他同學的分數。"}
          </div>`}
        </div>
      `;
    }

    function renderSubject(id) {
      const s = folderById(id);
      if (!s) return renderHome();
      const area = areaById(s.area);
      const items = orderedItems(id);
      document.title = toPlainLines(s.title) + "　張老師教學資源";
      $("app").innerHTML = `
        <div class="bar">
          <a class="btn btn-back" href="#/">← 返回目錄</a>
          ${area && !area.subject ? `<a class="btn btn-back" href="#/a/${area.id}">← ${escapeHtml(toPlainLines(area.title))}</a>` : ""}
        </div>
        <h3 class="sec">${s.emoji} ${escapeHtml(toPlainLines(s.title))}</h3>
        ${items.length ? `
          <p class="note">${editing
            ? "編輯排版中：可以改名稱、改下面小字，或撳「上移／下移」。改動會儲存，所有裝置都會見到。"
            : (items.some(it => it.noScore) ? "撳入去可見到連結及二維碼。" : "請選擇遊戲。撳入去先見到連結、二維碼同成績說明。")}</p>
          <div class="grid" data-kind="items" data-scope="${id}">
            ${renderCards(items, it => "#/i/" + it.id, "items")}
          </div>
        ` : `<div class="empty">此部分教材即將推出。</div>`}
      `;
      bindGrid("items", id);
    }

    function renderItem(id) {
      const it = withLabel("items", ITEMS.find(x => x.id === id));
      if (!it) return renderHome();
      const s = folderById(it.subject);
      const area = s ? areaById(s.area) : null;
      document.title = plainText(it.title) + "　張老師教學資源";
      $("app").innerHTML = `
        <div class="bar">
          <a class="btn btn-back" href="#/">← 返回目錄</a>
          ${area && !area.subject ? `<a class="btn btn-back" href="#/a/${area.id}">← ${escapeHtml(toPlainLines(area.title))}</a>` : ""}
          <a class="btn btn-back" href="#/s/${it.subject}">← ${s ? escapeHtml(toPlainLines(s.title)) : "返回"}</a>
        </div>
        ${itemBasics(it)}
      `;
    }

    const btnEdit = document.getElementById("btn-edit");
    btnEdit.addEventListener("click", async () => {
      if (editing) {
        try { await flushEdits(); } catch (err) { toast(err.message); }
        editing = false;
        document.body.classList.remove("editing");
        btnEdit.textContent = "編輯排版";
        btnEdit.classList.remove("on");
        route();
        return;
      }
      try {
        await unlockEdit();
      } catch (err) {
        toast(err.message || "未能開啟編輯");
        return;
      }
      editing = true;
      document.body.classList.add("editing");
      btnEdit.textContent = "完成排版";
      btnEdit.classList.add("on");
      route();
    });

    window.addEventListener("hashchange", route);

    (async function boot() {
      try {
        const local = localStorage.getItem("edu-layout");
        if (local) applyLayout(JSON.parse(local));
      } catch (_) {}
      try {
        const res = await fetch(GH_RAW + "card-order.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) applyLayout(await res.json());
      } catch (_) {}
      route();
    })();
  </script>
</body>
</html>
