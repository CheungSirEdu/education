<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>老師成績　生物和非生物</title>
  <style>
    body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; background: #f4f7f2; color: #1d2b1f; }
    header { background: #1b5e20; color: #fff; padding: 16px 20px; }
    h1 { margin: 0; font-size: 22px; }
    .sub { opacity: .9; margin-top: 4px; }
    main { padding: 16px; max-width: 980px; margin: 0 auto; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    .bar button, .bar a {
      background: #2e7d32; color: #fff; border: 0; border-radius: 10px;
      padding: 10px 14px; font-weight: 800; text-decoration: none; cursor: pointer;
    }
    .bar a.ghost, .bar button.ghost { background: #fff; color: #1b5e20; border: 2px solid #2e7d32; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat { background: #fff; border: 2px solid #c5dcc6; border-radius: 14px; padding: 10px 14px; min-width: 110px; }
    .stat b { display: block; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #d5e6d6; padding: 8px 10px; text-align: left; }
    th { background: #e8f5e9; }
    tr.miss td { color: #9e9e9e; }
    .ok { color: #1b5e20; font-weight: 800; }
    .tabs button { margin-right: 6px; }
    .tabs button.on { outline: 3px solid #f4d35e; }
    #note { margin: 8px 0 0; font-weight: 700; color: #3d5c40; }
    .del {
      background: #c62828; color: #fff; border: 0; border-radius: 8px;
      padding: 6px 10px; font-weight: 800; cursor: pointer;
    }
    .bar button.danger, .bar a.danger {
      background: #fff; color: #c62828; border: 2px solid #c62828;
    }
    .bar button.danger.on { background: #c62828; color: #fff; }
    #gate {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: #e8f5e9;
    }
    #gate .box {
      background: #fff; border: 5px solid #1b5e20; border-radius: 22px;
      padding: 22px; width: min(420px, 100%);
    }
    #gate h2 { margin: 0 0 8px; text-align: center; color: #1b5e20; }
    #gate p { text-align: center; font-weight: 700; color: #3d5c40; }
    #gate input {
      width: 100%; font: inherit; font-size: 24px; letter-spacing: 4px; text-align: center;
      padding: 12px; border: 3px solid #c5dcc6; border-radius: 12px; min-height: 56px;
    }
    #gate .err { min-height: 22px; text-align: center; color: #c62828; font-weight: 800; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="box">
      <h2>老師檢查成績</h2>
      <p>請輸入密碼</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" />
      <div class="err" id="pinErr"></div>
      <div class="bar" style="margin-top:12px">
        <button type="button" onclick="tryPin()">進入</button>
        <a class="ghost" href="index.html">返回評估</a>
      </div>
    </div>
  </div>
  <div id="app" class="hidden">
  <header>
    <h1>二年級科學　生物和非生物　成績</h1>
    <div class="sub">即時顯示學生交卷分數。Google 表分頁：2A班／2B班／2C班</div>
  </header>
  <main>
    <div class="bar">
      <button type="button" onclick="load()">重新整理</button>
      <a class="ghost" href="https://docs.google.com/spreadsheets/d/18Hr-LwnjE80Ja3JgD706x5T8qqIw-5GwLFNcp2dTM2o/edit" target="_blank" rel="noopener">打開成績 Google 表</a>
      <button type="button" class="danger" id="editBtn" onclick="toggleEdit()">編輯</button>
      <button type="button" class="danger hidden" id="delClassBtn" onclick="delClass()">刪除本班已交</button>
      <a class="ghost" href="index.html">學生評估頁</a>
      <button type="button" class="ghost" onclick="logout()">登出</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="stats" id="stats"></div>
    <table>
      <thead>
        <tr><th>班別</th><th>學號</th><th>日期</th><th>名字</th><th>分數</th><th>狀態</th><th id="opHead" class="hidden">操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="note"></p>
  </main>
  </div>
  <script>
    const TEACHER_PIN = "22463959";
    const SCORE_URL = "https://script.google.com/macros/s/AKfycbwJhLSC1iWTjyRENsVvlQTcrTJVA8IHW3KZXQC2PsoHPetI8P40-0ZMI88RQUxwNXvu/exec";
    const SCORE_TOKEN = "chilin-edu-2026";
    const ACTIVITY = "生物和非生物";
    const SHEET_ID = "1qY-l71g-ApKQGdHtsl9r7QkjcI6iFk7yu3CAu_NmW2w";
    let data = { roster: [], scores: {} };
    let klass = "2A";
    let timer = null;
    let editing = false;

    function unlocked() {
      try { return sessionStorage.getItem("p2-living-teacher") === "1"; } catch (e) { return false; }
    }
    function showApp() {
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      load();
      if (!timer) timer = setInterval(load, 5000);
    }
    function tryPin() {
      const pin = document.getElementById("pin");
      if (pin.value !== TEACHER_PIN) {
        document.getElementById("pinErr").textContent = "密碼不正確";
        pin.value = "";
        pin.focus();
        return;
      }
      try { sessionStorage.setItem("p2-living-teacher", "1"); } catch (e) {}
      showApp();
    }
    function logout() {
      try { sessionStorage.removeItem("p2-living-teacher"); } catch (e) {}
      location.href = "index.html";
    }
    document.getElementById("pin").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); tryPin(); }
    });
    if (unlocked()) showApp();
    else setTimeout(function () { document.getElementById("pin").focus(); }, 50);

    function keyOf(c, n) { return c + "|" + String(Number(n)); }

    function gvizCell(row, i) {
      const c = row && row.c && row.c[i];
      if (!c) return "";
      if (c.v === null || c.v === undefined) return c.f || "";
      return c.v;
    }
    function ymdFromGviz(v, formatted) {
      const m = String(v || "").match(/^Date\((\d+),(\d+),(\d+)/);
      if (m) return m[1] + "-" + String(Number(m[2]) + 1).padStart(2, "0") + "-" + String(Number(m[3])).padStart(2, "0");
      const s = String(formatted || v || "");
      const hk = s.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
      if (hk) return hk[1] + "-" + String(hk[2]).padStart(2, "0") + "-" + String(hk[3]).padStart(2, "0");
      const iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      return iso ? iso[1] + "-" + iso[2] + "-" + iso[3] : "";
    }
    function loadGviz() {
      return new Promise(function (resolve) {
        const cb = "living_gviz_" + Date.now();
        const timer = setTimeout(function () { cleanup(); resolve({}); }, 8000);
        function cleanup() {
          clearTimeout(timer);
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          if (s.parentNode) s.parentNode.removeChild(s);
        }
        window[cb] = function (json) {
          cleanup();
          resolve(parseGviz(json && json.table));
        };
        const s = document.createElement("script");
        s.onerror = function () { cleanup(); resolve({}); };
        s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
          "/gviz/tq?tqx=out:json;responseHandler:" + cb +
          "&sheet=" + encodeURIComponent(ACTIVITY);
        document.head.appendChild(s);
      });
    }
    function parseGviz(table) {
      const scores = {};
      if (!table) return scores;
      const cols = (table.cols || []).map(function (c) { return String(c.label || c.id || ""); });
      const idx = function (name) { return cols.indexOf(name); };
      const iTime = idx("時間"), iClass = idx("班別"), iNo = idx("學號");
      const iResult = idx("結果"), iStars = idx("星星");
      (table.rows || []).forEach(function (row) {
        const klass = String(gvizCell(row, iClass) || "").trim().toUpperCase().replace(/\s+/g, "");
        const no = String(parseInt(String(gvizCell(row, iNo)), 10));
        if (!klass || !no || no === "NaN") return;
        const result = String(iResult >= 0 ? gvizCell(row, iResult) : "");
        const stars = String(iStars >= 0 ? gvizCell(row, iStars) : "");
        const timeCell = row.c && iTime >= 0 ? row.c[iTime] : null;
        const date = ymdFromGviz(timeCell && timeCell.v, timeCell && timeCell.f);
        const key = keyOf(klass, no);
        if (/DELETE|刪除|\bDEL\b/i.test(result + " " + stars)) {
          scores[key] = { deleted: true };
          return;
        }
        const text = result.indexOf("/") >= 0 ? result : ((stars || "0") + "/10");
        const score = parseInt(String(stars || text), 10);
        scores[key] = {
          class: klass,
          no: no,
          date: date,
          text: text,
          score: isNaN(score) ? 0 : score,
          total: 10
        };
      });
      Object.keys(scores).forEach(function (k) {
        if (scores[k] && scores[k].deleted) delete scores[k];
      });
      return scores;
    }
    function postSheet(extra) {
      try {
        fetch(SCORE_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            token: SCORE_TOKEN,
            activity: ACTIVITY,
            class: extra.class,
            no: extra.no,
            level: extra.level || "ALL",
            result: extra.result || "DELETE",
            stars: extra.stars || "DEL",
            hero: "",
            seconds: ""
          })
        }).catch(function () {});
      } catch (e) {}
    }
    function load() {
      Promise.all([
        fetch("roster.json").then(function (r) { return r.json(); }).catch(function () { return { students: [] }; }),
        fetch("/api/scores").then(function (r) { return r.json(); }).catch(function () { return null; }),
        loadGviz()
      ]).then(function (arr) {
        data.roster = arr[0].students || arr[0].roster || [];
        const local = (arr[1] && (arr[1].scores || arr[1])) || {};
        const cloud = arr[2] || {};
        data.scores = Object.assign({}, local, cloud);
        Object.keys(data.scores).forEach(function (k) {
          if (data.scores[k] && data.scores[k].deleted) delete data.scores[k];
        });
        render();
      }).catch(function () {
        document.getElementById("note").textContent = "未能讀取成績，請重新整理。";
      });
    }

    function downloadExcel() {
      const headers = ["班別", "學號", "日期", "名字", "分數"];
      function cell(v) {
        return "<td>" + String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</td>";
      }
      const rows = [];
      ["2A", "2B", "2C"].forEach(function (c) {
        data.roster.filter(function (s) { return s.class === c; }).forEach(function (s) {
          const rec = data.scores[keyOf(s.class, s.no)] || data.scores[keyOf(s.class, String(Number(s.no)))] || null;
          rows.push([s.class, s.no, rec ? (rec.date || "") : "", s.name, rec ? (rec.text || "") : ""]);
        });
      });
      const html = "<html><head><meta charset='UTF-8'></head><body><table border='1'><tr>" +
        headers.map(cell).join("") + "</tr>" +
        rows.map(function (r) { return "<tr>" + r.map(cell).join("") + "</tr>"; }).join("") +
        "</table></body></html>";
      const blob = new Blob(["\ufeff" + html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "二年級生物和非生物實作成績.xls";
      a.click();
      URL.revokeObjectURL(a.href);
      document.getElementById("note").textContent = "已下載 Excel，可用 Excel 打開後另存到共用資料夾。";
    }
    function rebuild() {
      downloadExcel();
      fetch("/api/excel", { method: "POST" }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.ok) document.getElementById("note").textContent = "已更新共用資料夾的 Excel，並下載一份副本。";
      }).catch(function () {});
    }

    function toggleEdit() {
      editing = !editing;
      const btn = document.getElementById("editBtn");
      btn.textContent = editing ? "完成編輯" : "編輯";
      btn.classList.toggle("on", editing);
      document.getElementById("delClassBtn").classList.toggle("hidden", !editing);
      document.getElementById("opHead").classList.toggle("hidden", !editing);
      render();
    }

    function delOne(c, n, name) {
      if (!editing) return;
      const label = c + "班　" + n + "號" + (name ? "　" + name : "");
      if (!confirm("確定刪除 " + label + " 的成績？")) return;
      postSheet({ class: c, no: String(n), result: "DELETE", stars: "DEL", level: "ALL" });
      fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: TEACHER_PIN, class: c, no: String(n) })
      }).then(function () {
        document.getElementById("note").textContent = "已刪除：" + label;
        setTimeout(load, 1200);
      }).catch(function () {
        document.getElementById("note").textContent = "已刪除：" + label;
        setTimeout(load, 1200);
      });
    }

    function delClass() {
      if (!editing) return;
      const rows = data.roster.filter(function (s) { return s.class === klass; });
      const done = rows.filter(function (s) {
        return data.scores[keyOf(s.class, s.no)] || data.scores[keyOf(s.class, String(Number(s.no)))];
      }).length;
      if (!done) {
        document.getElementById("note").textContent = klass + "班暫時沒有已交成績。";
        return;
      }
      if (!confirm("確定刪除 " + klass + "班全部 " + done + " 份已交成績？")) return;
      rows.forEach(function (s) {
        const rec = data.scores[keyOf(s.class, s.no)] || data.scores[keyOf(s.class, String(Number(s.no)))];
        if (rec) postSheet({ class: s.class, no: String(s.no), result: "DELETE", stars: "DEL", level: "ALL" });
      });
      fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: TEACHER_PIN, class: klass, all: true })
      }).then(function () {
        document.getElementById("note").textContent = "已刪除 " + klass + "班已交成績";
        setTimeout(load, 1500);
      }).catch(function () {
        document.getElementById("note").textContent = "已刪除 " + klass + "班已交成績";
        setTimeout(load, 1500);
      });
    }

    function render() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = ["2A", "2B", "2C"].map(function (c) {
        return '<button type="button" class="' + (c === klass ? "on" : "") + '" onclick="klass=\'' + c + '\';render()">' + c + "班</button>";
      }).join("");
      document.getElementById("opHead").classList.toggle("hidden", !editing);
      const rows = data.roster.filter(function (s) { return s.class === klass; });
      let done = 0;
      const body = rows.map(function (s) {
        const rec = data.scores[keyOf(s.class, s.no)] || data.scores[keyOf(s.class, String(Number(s.no)))] || null;
        if (rec) done += 1;
        const date = rec ? (rec.date || "") : "";
        const score = rec ? (rec.text || ((rec.score || "") + "/" + (rec.total || 10))) : "";
        const op = editing
          ? (rec
              ? "<td><button type='button' class='del' onclick=\"delOne('" + s.class + "','" + s.no + "','" + String(s.name || "").replace(/'/g, "") + "')\">刪除</button></td>"
              : "<td></td>")
          : "";
        return "<tr class='" + (rec ? "" : "miss") + "'><td>" + s.class + "</td><td>" + s.no + "</td><td>"
          + date + "</td><td>" + s.name + "</td><td class='" + (rec ? "ok" : "") + "'>"
          + (score || "—") + "</td><td>" + (rec ? "已交" : "未交") + "</td>" + op + "</tr>";
      }).join("");
      document.getElementById("tbody").innerHTML = body || "<tr><td colspan='" + (editing ? 7 : 6) + "'>沒有名單</td></tr>";
      document.getElementById("stats").innerHTML =
        '<div class="stat"><span>已交</span><b>' + done + "</b></div>"
        + '<div class="stat"><span>未交</span><b>' + (rows.length - done) + "</b></div>"
        + '<div class="stat"><span>全班</span><b>' + rows.length + "</b></div>";
    }

  </script>
</body>
</html>
