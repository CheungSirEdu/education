<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="動手種植物" />
  <meta name="theme-color" content="#2f7d32" />
  <meta name="format-detection" content="telephone=no" />
  <title>動手種植物　綠豆幼苗會對光的方向做出反應嗎？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #2f7d32;
      --green-dark: #1b5e20;
      --yellow: #f4d35e;
      --ink: #1d2b1f;
      --sky: #8fd3f0;
      --card: #fffef6;
      --safe-t: env(safe-area-inset-top);
      --safe-b: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
      color: var(--ink); background: #7ec8e3;
      touch-action: manipulation; user-select: none;
      overscroll-behavior: none;
    }
    button { font: inherit; }
    .hidden { display: none !important; }

    /* ===== start ===== */
    .panel {
      position: fixed; inset: 0; z-index: 20;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: linear-gradient(#8fd3f0, #c8f0c0);
      padding: max(12px, var(--safe-t)) 12px max(16px, var(--safe-b));
    }
    .card {
      background: var(--card); border: 6px solid var(--green); border-radius: 28px;
      padding: 16px 16px 18px; max-width: 560px; width: 100%;
      margin: 10px auto; box-shadow: 0 10px 0 var(--green-dark);
    }
    h1 { margin: 0 0 4px; font-size: clamp(22px, 6vw, 30px); text-align: center; color: var(--green-dark); }
    .sub { text-align: center; margin: 0 0 12px; font-weight: 700; color: #3d5c40; font-size: 15px; }
    .chars { display: flex; gap: 16px; justify-content: center; margin: 4px 0 12px; }
    .chars img { height: 92px; width: auto; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
    .steps { display: grid; gap: 8px; margin: 0 0 14px; }
    .step {
      display: grid; grid-template-columns: 42px 52px 1fr; gap: 8px; align-items: center;
      background: #fff; border: 3px solid #c5dcc6; border-radius: 16px; padding: 8px 10px;
    }
    .step b {
      width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #fff;
      display: grid; place-items: center; font-size: 16px;
    }
    .step img { width: 48px; height: 48px; object-fit: contain; }
    .step span { font-size: 14px; font-weight: 700; line-height: 1.35; }
    .primary {
      width: 100%; border: 0; background: var(--green); color: #fff; font-weight: 900;
      font-size: 22px; padding: 14px; border-radius: 16px; cursor: pointer;
      box-shadow: 0 6px 0 var(--green-dark);
    }
    .primary:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--green-dark); }
    .primary.gold { background: #ef6c00; box-shadow: 0 6px 0 #e65100; margin-top: 8px; }
    .ghost-btn {
      width: 100%; margin-top: 8px; border: 4px solid var(--green); background: #fff;
      color: var(--green-dark); font-weight: 900; font-size: 16px; padding: 10px; border-radius: 14px;
    }
    .ids { display: flex; gap: 10px; margin: 0 0 12px; }
    .ids label { flex: 1; font-size: 14px; font-weight: 700; color: var(--green-dark); }
    .ids input {
      width: 100%; margin-top: 4px; font: inherit; font-weight: 700; font-size: 20px;
      padding: 12px; border: 3px solid #c5dcc6; border-radius: 12px; background: #fff;
      min-height: 52px;
    }
    .ids input:focus { outline: 0; border-color: var(--green); background: #e8f5e9; }
    .id-note { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: #3d5c40; text-align: center; }
    .primary:disabled { background: #9aaa9a; box-shadow: none; cursor: not-allowed; }

    /* ===== game chrome ===== */
    #game {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      padding: max(6px, var(--safe-t)) 8px max(8px, var(--safe-b));
      background: #6ec1e0;
    }
    .hud {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .day-chip {
      background: #fffef6; border: 4px solid var(--green); border-radius: 16px;
      padding: 6px 12px; font-weight: 900; font-size: clamp(16px, 4.2vw, 20px);
      color: var(--green-dark); min-width: 96px; text-align: center;
    }
    .day-clock {
      flex-shrink: 0; width: 58px; text-align: center;
    }
    .day-clock svg {
      width: 54px; height: 54px; display: block; margin: 0 auto;
      background: #fffef6; border-radius: 50%;
      border: 3px solid var(--green-dark);
      box-shadow: 0 3px 0 var(--green);
    }
    .day-clock span {
      display: block; font-size: 10px; font-weight: 900; color: var(--green-dark); line-height: 1.1; margin-top: 2px;
    }
    .hud-btn {
      border: 0; border-radius: 14px; font-weight: 900; cursor: pointer;
      min-height: 48px; padding: 8px 12px; color: #fff;
    }
    #passDay {
      width: 100%; flex: none; background: #ef6c00; box-shadow: 0 4px 0 #e65100;
      font-size: clamp(16px, 4vw, 20px); margin-top: 8px;
    }
    #passDay:disabled { background: #b0a090; box-shadow: none; }
    #logBtn { background: #1565c0; box-shadow: 0 4px 0 #0d47a1; font-size: 14px; margin-left: auto; }
    #resetBtn { background: #6d4c41; box-shadow: 0 4px 0 #4e342e; font-size: 14px; }
    #hint {
      margin: 6px 0; background: #fffef6; border: 3px solid var(--yellow); border-radius: 14px;
      padding: 6px 10px; font-weight: 700; font-size: 14px; line-height: 1.4;
      min-height: 40px; flex-shrink: 0;
    }

    /* ===== scene ===== */
    #scene {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .zone {
      position: relative; border-radius: 20px; overflow: hidden;
      border: 4px solid rgba(255,255,255,.55); min-height: 0;
      display: flex; flex-direction: column;
    }
    .zone.hot { outline: 4px solid var(--yellow); outline-offset: -4px; }
    .zone-label {
      position: relative; z-index: 3; text-align: center; font-weight: 900; font-size: 13px;
      padding: 4px 6px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35);
    }
    .pots-row {
      position: relative; z-index: 4; flex: 1; display: flex; justify-content: center;
      align-items: flex-end; gap: 8px; padding: 0 6px 8px; min-height: 0;
    }
    #z-window { background: linear-gradient(#7ec8f0 0%, #b8e4fb 46%, #d7c4a0 46%, #d7c4a0 51%, #efe6d6 51%, #efe6d6 100%); }
    #z-window .zone-label { background: rgba(239,108,0,.88); }
    .sky-tint {
      position: absolute; left: 0; right: 0; top: 0; height: 46%;
      z-index: 0; pointer-events: none;
    }
    .sun {
      position: absolute; left: 12%; top: 18%; width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff59d, #ffb300); z-index: 1;
      box-shadow: 0 0 24px 8px rgba(255,213,79,.7);
    }
    .moon {
      position: absolute; left: 64%; top: 12%; width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffde7, #e0e0e0);
      box-shadow: 0 0 14px rgba(255,255,220,.8); z-index: 1; opacity: 0;
    }
    .stars {
      position: absolute; left: 0; right: 0; top: 0; height: 46%; z-index: 1; pointer-events: none; opacity: 0;
      background-image:
        radial-gradient(circle, #fff 1.2px, transparent 1.4px),
        radial-gradient(circle, #fffde7 1px, transparent 1.3px),
        radial-gradient(circle, #fff 1.1px, transparent 1.3px);
      background-size: 42px 36px, 58px 44px, 36px 50px;
      background-position: 12% 20%, 70% 30%, 40% 12%;
    }
    .dir-tag {
      position: absolute; top: 7%; z-index: 3;
      font-size: 12px; font-weight: 900; color: #1b5e20;
      background: #fffef6cc; border-radius: 8px; padding: 2px 7px;
    }
    .dir-tag.east { left: 9%; }
    .dir-tag.west { right: 9%; }
    .rays {
      position: absolute; inset: 0 0 45% 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(105deg, transparent 0 18px, rgba(255,255,180,.18) 18px 28px);
    }
    .window-frame {
      position: absolute; left: 8%; right: 8%; top: 6%; height: 38%;
      border: 5px solid #fff; border-bottom-width: 10px; border-radius: 6px 6px 0 0;
      z-index: 2; pointer-events: none; box-shadow: inset 0 0 0 3px #90caf9;
    }
    #z-dark { background: linear-gradient(#1a1520 0%, #2a2233 70%, #3e3428 70%, #2a231c 100%); }
    #z-dark .zone-label { background: rgba(40,30,50,.9); }
    .cupboard {
      position: absolute; left: 6%; right: 6%; top: 10%; bottom: 8%;
      border: 6px solid #4e342e; border-radius: 8px; z-index: 1;
      background: linear-gradient(#1c1424, #2b2230);
      box-shadow: inset 0 0 40px rgba(0,0,0,.65);
    }
    .shelf {
      position: absolute; left: 4%; right: 4%; bottom: 22%; height: 8px;
      background: #5d4037; z-index: 2; border-radius: 2px;
    }

    #table {
      flex-shrink: 0; height: 108px; margin-top: 8px; border-radius: 18px;
      background: linear-gradient(#d7b07a, #c49a62); border: 4px solid #8d6e4a;
      display: flex; align-items: stretch; position: relative;
    }
    #table .zone-label {
      position: absolute; top: 4px; left: 8px; color: #5d4037; text-shadow: none; font-size: 12px; padding: 0;
    }
    #table .pots-row { padding-bottom: 4px; }

    /* ===== pots ===== */
    .pot {
      width: 128px; position: relative; touch-action: none; cursor: grab;
      flex-shrink: 0;
    }
    .pot.hot { filter: drop-shadow(0 0 8px #ffd54f); }
    .sprouts {
      position: absolute; left: -22px; right: -22px; bottom: 74px; height: 250px;
      pointer-events: none; z-index: 3; overflow: visible;
    }
    .sprouts svg { overflow: visible; }
    .cup-body {
      position: relative; z-index: 2; height: 100px;
      background: linear-gradient(180deg, rgba(210,238,250,.35), rgba(180,220,240,.55));
      border: 3px solid #2c3d4a; border-top-width: 4px;
      border-radius: 6px 6px 18px 18px;
      clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
      overflow: hidden;
    }
    .water-layer {
      position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
      background: linear-gradient(#81d4faaa, #29b6f6cc); transition: height .4s;
    }
    .cotton-layer {
      position: absolute; left: 6%; right: 6%; bottom: 10px; height: 36px;
      background:
        radial-gradient(circle at 28% 40%, #fff 0 42%, transparent 46%),
        radial-gradient(circle at 62% 35%, #fff 0 40%, transparent 45%),
        radial-gradient(circle at 48% 62%, #f5f5f5 0 46%, transparent 50%),
        radial-gradient(circle at 50% 50%, #eceff1, #e0e0e0 70%);
      border-radius: 46% 54% 38% 48%; opacity: 0; transition: opacity .25s;
      box-shadow: 0 2px 0 #cfd8dc;
    }
    .cotton-layer.on { opacity: 1; }
    .bean-layer {
      position: absolute; left: 12%; right: 12%; bottom: 26px; height: 24px;
      display: flex; justify-content: center; gap: 4px; align-items: flex-end;
    }
    .bean-dot {
      width: 14px; height: 16px; background: #6b8e23; border: 2px solid #3e4d18;
      border-radius: 50%;
    }
    .bean-dot.swell { width: 18px; height: 21px; background: #7cb342; }
    .pot-tag {
      text-align: center; font-size: 11px; font-weight: 900; color: var(--green-dark);
      background: #fffef6cc; border-radius: 8px; margin-top: 2px; padding: 1px 4px;
    }

    /* ===== tray ===== */
    #tray {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      margin-top: 8px;
    }
    .tool {
      touch-action: none; cursor: grab; border: 3px solid #c5dcc6; background: #fffef6;
      border-radius: 16px; padding: 6px 4px 8px; display: flex; flex-direction: column;
      align-items: center; gap: 2px; box-shadow: 0 4px 0 #8fbf92; min-height: 78px;
    }
    .tool img { width: 48px; height: 48px; object-fit: contain; pointer-events: none; }
    .tool span { font-size: 12px; font-weight: 900; color: var(--green-dark); }
    .tool.used { opacity: .45; }
    .tool:active { transform: translateY(2px); box-shadow: 0 2px 0 #8fbf92; }

    #ghost {
      position: fixed; pointer-events: none; z-index: 50; width: 72px; height: 72px;
      transform: translate(-50%, -60%); display: none; filter: drop-shadow(0 8px 8px rgba(0,0,0,.25));
    }
    #ghost img, #ghost .mini-pot { width: 100%; height: 100%; object-fit: contain; }

    .sprouts svg path, .sprouts svg ellipse, .sprouts svg circle {
      transition: none;
    }
    .bean-dot { transition: width .6s, height .6s, background .6s; }

    .modal {
      position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.4);
      display: none; align-items: flex-end; justify-content: center;
      padding: 12px 12px max(16px, var(--safe-b));
    }
    .modal.show { display: flex; }
    .sheet {
      background: var(--card); border: 6px solid var(--green); border-radius: 24px 24px 16px 16px;
      padding: 16px; width: min(560px, 100%); max-height: 80dvh; overflow: auto;
      box-shadow: 0 10px 0 var(--green-dark);
    }
    .sheet h2 { margin: 0 0 8px; color: var(--green-dark); font-size: 22px; text-align: center; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 700; margin: 8px 0 12px; }
    th, td { border: 2px solid #c5dcc6; padding: 8px; text-align: center; }
    th { background: #e8f5e9; }
    .ok { color: #1b5e20; }
    .warn { color: #e65100; }

    @media (max-width: 420px) {
      .day-clock { width: 46px; }
      .day-clock svg { width: 44px; height: 44px; }
      .day-clock span { font-size: 9px; }
      .dir-tag { font-size: 11px; padding: 1px 5px; }
    }
    @media (max-height: 680px) {
      #table { height: 88px; }
      .chars img { height: 72px; }
      .tool img { width: 40px; height: 40px; }
      .tool { min-height: 68px; }
      .pot { width: 110px; }
      .cup-body { height: 86px; }
      .sprouts { height: 190px; bottom: 62px; }
    }
    @media (max-height: 560px) {
      #table { display: none; }
      .sprouts { height: 140px; }
    }
    @media (min-width: 820px) {
      #game { max-width: 980px; left: 50%; transform: translateX(-50%); width: 100%; }
      .pot { width: 148px; }
      .cup-body { height: 112px; }
      .sprouts { height: 280px; bottom: 84px; }
    }
  </style>
</head>
<body>
  <section id="start" class="panel">
    <div class="card">
      <h1>綠豆幼苗會對光的方向做出反應嗎？</h1>
      <p class="sub">二年級科學　第 3 課 動手種植物　活動 5</p>
      <p class="id-note">開始前請填寫班別及學號，無須填寫姓名。</p>
      <div class="ids">
        <label>班別<input id="klass" maxlength="8" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="例如 2A"></label>
        <label>學號<input id="stuno" maxlength="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例如 12"></label>
      </div>
      <div class="chars">
        <img src="assets/boy.png" alt="小志" draggable="false">
        <img src="assets/girl.png" alt="小蓮" draggable="false">
      </div>
      <div class="steps">
        <div class="step"><b>1</b><img src="assets/beans.png" alt="" draggable="false"><span>拖動綠豆，放入盆栽中。</span></div>
        <div class="step"><b>2</b><img src="assets/cup.png" alt="" draggable="false"><span>拖動器皿，種出兩個盆栽。</span></div>
        <div class="step"><b>3</b><img src="assets/water.png" alt="" draggable="false"><span>拖動水杯，為盆栽加水。</span></div>
        <div class="step"><b>4</b><img src="assets/cotton.png" alt="" draggable="false"><span>拖動棉花，代替泥土，讓綠豆生長。</span></div>
        <div class="step"><b>5</b><span style="grid-column:2/-1">一個盆栽放在窗邊（有陽光），另一個放在黑暗的地方。</span></div>
        <div class="step"><b>6</b><span style="grid-column:2/-1">按下「過一日」，可看見綠豆慢慢長高。請重點觀察第 1、2、4、9 日。</span></div>
      </div>
      <button class="primary" id="startBtn" disabled>開始種植</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="hud">
      <div class="day-chip">第 <span id="dayNum">0</span> 日</div>
      <div class="day-clock" id="dayClock" aria-label="二十四小時時鐘">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="#fffef6" stroke="#1b5e20" stroke-width="3"/>
          <g fill="#1b5e20" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">
            <text x="50" y="22">12</text>
            <text x="80" y="54">3</text>
            <text x="50" y="86">6</text>
            <text x="20" y="54">9</text>
          </g>
          <line id="clockMinute" x1="50" y1="50" x2="50" y2="18" stroke="#1565c0" stroke-width="3" stroke-linecap="round" transform="rotate(0 50 50)"/>
          <line id="clockHour" x1="50" y1="50" x2="50" y2="28" stroke="#1b5e20" stroke-width="5" stroke-linecap="round" transform="rotate(0 50 50)"/>
          <circle cx="50" cy="50" r="4" fill="#ef6c00"/>
        </svg>
        <span>24小時</span>
      </div>
      <button class="hud-btn" id="logBtn">紀錄</button>
      <button class="hud-btn" id="resetBtn">重新開始</button>
    </div>
    <div id="hint"></div>
    <div id="scene">
      <div class="zone" id="z-window" data-zone="window">
        <div class="sky-tint" id="skyTint"></div>
        <div class="stars" id="stars"></div>
        <div class="sun" id="sun"></div>
        <div class="moon" id="moon"></div>
        <div class="rays"></div>
        <div class="window-frame"></div>
        <div class="dir-tag east">東</div>
        <div class="dir-tag west">西</div>
        <div class="zone-label">☀️ 窗邊 · 有陽光</div>
        <div class="pots-row" data-slot="window"></div>
      </div>
      <div class="zone" id="z-dark" data-zone="dark">
        <div class="cupboard"></div>
        <div class="shelf"></div>
        <div class="zone-label">🌑 黑暗的地方</div>
        <div class="pots-row" data-slot="dark"></div>
      </div>
    </div>
    <div class="zone" id="table" data-zone="table">
      <div class="zone-label">🪵 工作枱　可先在此種植，再移到窗邊或黑暗處</div>
      <div class="pots-row" data-slot="table"></div>
    </div>
    <div id="tray">
      <div class="tool" data-tool="beans"><img src="assets/beans.png" alt="綠豆" draggable="false"><span>綠豆</span></div>
      <div class="tool" data-tool="cup"><img src="assets/cup.png" alt="器皿" draggable="false"><span>器皿</span></div>
      <div class="tool" data-tool="water"><img src="assets/water.png" alt="水杯" draggable="false"><span>水杯</span></div>
      <div class="tool" data-tool="cotton"><img src="assets/cotton.png" alt="棉花" draggable="false"><span>棉花</span></div>
    </div>
    <button class="hud-btn" id="passDay">過一日 ▶</button>
  </section>

  <img id="ghost" alt="">
  <div class="modal" id="logModal">
    <div class="sheet" id="logSheet"></div>
  </div>

  <script>
    const MAX_POTS = 2;
    const MAX_DAY = 20;
    const QA = /(?:\?|&)qa=1(?:&|$)/.test(location.search);
    const DAY_MS = QA ? 400 : 6000;
    const ICONS = {
      beans: "assets/beans.png",
      cup: "assets/cup.png",
      water: "assets/water.png",
      cotton: "assets/cotton.png"
    };

    const $ = (id) => document.getElementById(id);
    const SCORE_URL = "https://script.google.com/macros/s/AKfycbyQsIuKgSBXqPYXENmsbS79X2ND6_otmq9PefobcVhpr6uapZko-6SIs8bK7mo7xMHhdg/exec";
    const SCORE_TOKEN = "chilin-edu-2026";
    const ACTIVITY = "動手種植物";
    const state = {
      day: 0,
      passing: false,
      pots: [],
      nextId: 1,
      startedAt: 0
    };

    function identityOk() {
      const klass = ($("klass").value || "").trim().slice(0, 8);
      const no = ($("stuno").value || "").trim();
      return { ok: klass.length >= 1 && /^\d{1,3}$/.test(no), class: klass, no };
    }

    function refreshStart() {
      $("startBtn").disabled = !identityOk().ok;
    }

    function sendLog(level, result) {
      const id = identityOk();
      if (!id.ok) return;
      const secs = state.startedAt ? String(Math.max(1, Math.round((Date.now() - state.startedAt) / 1000))) : "";
      try {
        fetch(SCORE_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            token: SCORE_TOKEN,
            class: id.class,
            no: id.no,
            activity: ACTIVITY,
            level: level,
            result: result,
            stars: String(state.day || ""),
            hero: "",
            seconds: secs
          })
        }).catch(function () {});
      } catch (e) {}
    }

    function beep(type) {
      try {
        const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === "drop") { o.frequency.value = 520; g.gain.setValueAtTime(0.05, now); }
        else if (type === "water") { o.frequency.value = 420; g.gain.setValueAtTime(0.06, now); }
        else if (type === "day") { o.frequency.value = 660; g.gain.setValueAtTime(0.07, now); }
        else { o.frequency.value = 340; g.gain.setValueAtTime(0.04, now); }
        o.type = "sine";
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        o.start(now); o.stop(now + 0.2);
      } catch (e) {}
    }

    function lightOf(zone) {
      if (zone === "window") return 1;
      if (zone === "table") return 0.4;
      return 0;
    }

    function look(p) {
      const light = lightOf(p.zone);
      const age = p.age;
      let stage = 0;
      if (p.beans <= 0) stage = -1;
      else if (p.health < 0.35 && age >= 3) stage = 6;
      else if (age >= 12) stage = 5;
      else if (age >= 7) stage = 4;
      else if (age >= 4) stage = 3;
      else if (age >= 2) stage = 2;
      else if (age >= 1 || p.moisture > 0.3) stage = 1;
      else stage = 0;

      let h = 0;
      if (age >= 1.2) h = 16 + Math.max(0, age - 1.2) * (light > 0.7 ? 7.4 : light > 0.2 ? 8.8 : 12.6);
      if (stage === 6) h *= 0.65;
      h = Math.min(h, light > 0.7 ? 128 : 188);
      const leafT = Math.max(0, Math.min(1, (age - 3.2) / 3));

      return {
        stage, beans: p.beans, cotton: p.cotton, moisture: p.moisture,
        age, health: p.health, light, h, leafT,
        lean: light > 0.7 && age >= 1.5 ? 8 + Math.min(age, 12) * 1.1 : (light < 0.25 ? 0 : 2),
        stemW: light > 0.7 ? 4.6 + Math.min(age, 12) * 0.38 : 2.6 + age * 0.14,
        stem: light > 0.7 ? "#3d7a32" : light > 0.2 ? "#7a9a45" : "#efe6a6",
        leaf: light > 0.7 ? "#43a047" : light > 0.2 ? "#9aaa4a" : "#e6d56a",
        wilt: stage === 6
      };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function ease(t) { return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, t))); }
    function mixHex(a, b, t) {
      const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
      const r = Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, t));
      const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t));
      const bl = Math.round(lerp(pa & 255, pb & 255, t));
      return "#" + [r, g, bl].map((n) => n.toString(16).padStart(2, "0")).join("");
    }
    function lerpLook(A, B, t) {
      t = ease(t);
      return {
        stage: t < 0.45 ? A.stage : B.stage,
        beans: B.beans,
        cotton: B.cotton,
        moisture: lerp(A.moisture, B.moisture, t),
        age: lerp(A.age, B.age, t),
        health: lerp(A.health, B.health, t),
        light: B.light,
        h: lerp(A.h, B.h, t),
        leafT: lerp(A.leafT || 0, B.leafT || 0, t),
        lean: lerp(A.lean || 0, B.lean || 0, t),
        stemW: lerp(A.stemW, B.stemW, t),
        stem: mixHex(A.stem, B.stem, t),
        leaf: mixHex(A.leaf, B.leaf, t),
        wilt: t > 0.6 ? B.wilt : A.wilt
      };
    }

    function colorWord(L) {
      if (L.stage < 0) return "空杯";
      if (L.stage === 0) return "乾豆";
      if (L.age < 2) return "已浸水";
      if (L.wilt) return "發蔫";
      if (L.age < 4) return "已長出白根";
      if (L.light > 0.7) return L.age >= 7 ? "葉片綠色、莖粗壯" : "開始出芽";
      if (L.light < 0.2) return L.age >= 7 ? "葉片發黃，莖又細又長" : "白芽";
      return "稍帶綠色";
    }

    function heightWord(L) {
      if (L.stage < 2) return "—";
      if (L.wilt) return "垂低";
      if (L.age < 4) return "很短";
      if (L.light > 0.7) return L.age >= 7 ? "較矮、粗壯" : "開始長高";
      if (L.light < 0.2) return L.age >= 7 ? "又高又細" : "開始長高";
      return "中等";
    }

    function sproutSVG(L) {
      if (L.stage < 0) return "";
      const n = Math.min(Math.max(L.beans, 0), 3);
      const w = 110, boxH = 190;
      const parts = [];
      const rootT = Math.max(0, Math.min(1, (L.age - 0.8) / 1.2));
      if (rootT > 0.05) {
        for (let i = 0; i < n; i++) {
          const x = 26 + i * 28;
          const len = 12 + rootT * 20;
          parts.push(`<path d="M${x} ${boxH - 8} q ${-10 * rootT} ${len * 0.55} ${-4 * rootT} ${len}" stroke="#f3edd4" stroke-width="${1.8 + rootT * 0.8}" fill="none" stroke-linecap="round" opacity="${rootT}"/>`);
          parts.push(`<path d="M${x} ${boxH - 8} q ${11 * rootT} ${len * 0.5} ${6 * rootT} ${len * 0.9}" stroke="#f3edd4" stroke-width="${1.5 + rootT * 0.7}" fill="none" stroke-linecap="round" opacity="${rootT}"/>`);
        }
      }
      if (L.h > 3) {
        for (let i = 0; i < n; i++) {
          const x = 26 + i * 28;
          const hh = L.h * (0.82 + i * 0.09);
          const lean = (L.lean || 0) + (L.light < 0.25 ? (i - 1) * 4 : 0);
          const topX = x + lean + (L.wilt ? 14 * Math.min(1, L.h / 40) : 0);
          const d = L.wilt
            ? `M${x} ${boxH - 10} C ${x + 10} ${boxH - 10 - hh * 0.45}, ${topX} ${boxH - 10 - hh * 0.7}, ${topX + 4} ${boxH - 10 - hh}`
            : `M${x} ${boxH - 10} C ${x} ${boxH - 10 - hh * 0.4}, ${x + lean * 0.6} ${boxH - 10 - hh * 0.75}, ${topX} ${boxH - 10 - hh}`;
          parts.push(`<path d="${d}" stroke="${L.stem}" stroke-width="${L.stemW}" fill="none" stroke-linecap="round"/>`);
          const ly = boxH - 10 - hh;
          const leafT = L.leafT || 0;
          if (leafT > 0.08) {
            const lw = (L.light > 0.7 ? 16 : 9.5) * leafT;
            const lh = (L.light > 0.7 ? 11 : 6.5) * leafT;
            parts.push(`<ellipse cx="${topX - lw * 0.55}" cy="${ly + 4}" rx="${lw}" ry="${lh}" fill="${L.leaf}" opacity="${leafT}" transform="rotate(-32 ${topX - lw * 0.55} ${ly + 4})"/>`);
            parts.push(`<ellipse cx="${topX + lw * 0.55}" cy="${ly + 4}" rx="${lw}" ry="${lh}" fill="${L.leaf}" opacity="${leafT}" transform="rotate(32 ${topX + lw * 0.55} ${ly + 4})"/>`);
            if (leafT > 0.55) {
              const t2 = (leafT - 0.55) / 0.45;
              parts.push(`<ellipse cx="${topX - 7}" cy="${ly + 18}" rx="${lw * 0.7 * t2}" ry="${lh * 0.7 * t2}" fill="${L.leaf}" opacity="${t2}" transform="rotate(-18 ${topX - 7} ${ly + 18})"/>`);
              parts.push(`<ellipse cx="${topX + 7}" cy="${ly + 18}" rx="${lw * 0.7 * t2}" ry="${lh * 0.7 * t2}" fill="${L.leaf}" opacity="${t2}" transform="rotate(18 ${topX + 7} ${ly + 18})"/>`);
            }
          } else {
            const r = 3.4 + Math.min(L.h / 28, 3.2);
            parts.push(`<circle cx="${topX}" cy="${ly}" r="${r}" fill="#c9c15a"/>`);
          }
        }
      }
      return `<svg viewBox="0 0 ${w} ${boxH}" width="100%" height="100%" overflow="visible">${parts.join("")}</svg>`;
    }

    function hintText() {
      const pots = state.pots;
      if (pots.length === 0) return "① 請把「器皿」拖到窗邊、黑暗處或工作枱。";
      if (pots.some((p) => !p.cotton)) return "② 請把棉花放入器皿，代替泥土，讓綠豆生長。";
      if (pots.some((p) => p.cotton && p.beans === 0)) return "③ 請把綠豆放在棉花上。";
      if (pots.some((p) => p.beans && p.moisture < 0.4)) return "④ 請把水杯拖到盆栽上，加入適量的水。";
      const zones = new Set(pots.map((p) => p.zone));
      if (pots.length < 2) return "請再種一個盆栽。一個放在窗邊，一個放在黑暗處，實驗才公平。";
      if (!(zones.has("window") && zones.has("dark"))) return "⑤ 請把一個盆栽放在窗邊（有陽光），另一個放在黑暗的地方。";
      if (state.day === 0) return "⑥ 準備完成後，請按「過一日」。綠豆會慢慢長高。請觀察第 1、4、9 日。";
      if (state.day === 2) return "兩天後：窗邊的幼苗是否向着陽光？生長方向與窗口方向相同還是相反？";
      if (state.day < 4) return `現在是第 ${state.day} 日。請繼續過日，重點觀察第 4 日和第 9 日。`;
      if (state.day < 9) return "窗邊的幼苗會向着陽光彎曲；黑暗處的幼苗又黃又細長。請按「紀錄」對照。";
      if (state.day < 20) return "綠豆幼苗會對光的方向做出反應：向着陽光生長。可以觀察到第 20 日。";
      return "已到第 20 日。請按「紀錄」查看你的發現。";
    }

    function render() {
      $("dayNum").textContent = state.day;
      $("hint").textContent = state.passing
        ? "請觀察：太陽由東邊升起、西邊落下，時鐘轉兩圈，就是一日（二十四小時）。綠豆幼苗正在慢慢生長。"
        : hintText();
      $("passDay").disabled = state.passing || state.day >= MAX_DAY;
      $("passDay").textContent = state.day >= MAX_DAY ? "已到第 20 日" : (state.passing ? "觀察中…" : "過一日 ▶");
      document.querySelector('[data-tool="cup"]').classList.toggle("used", state.pots.length >= MAX_POTS);

      for (const slot of ["window", "dark", "table"]) {
        const row = document.querySelector(`[data-slot="${slot}"]`);
        row.innerHTML = "";
        state.pots.filter((p) => p.zone === slot).forEach((p) => row.appendChild(potEl(p)));
      }
    }

    function potEl(p) {
      const L = look(p);
      const el = document.createElement("div");
      el.className = "pot";
      el.dataset.id = p.id;
      const waterH = Math.min(42, p.moisture * 14);
      const beans = [];
      for (let i = 0; i < Math.min(p.beans, 4); i++) {
        beans.push(`<i class="bean-dot${L.stage >= 1 ? " swell" : ""}"></i>`);
      }
      const place = p.zone === "window" ? "窗邊" : p.zone === "dark" ? "黑暗" : "枱";
      el.innerHTML = `
        <div class="sprouts">${sproutSVG(L)}</div>
        <div class="cup-body">
          <div class="water-layer" style="height:${waterH}%"></div>
          <div class="cotton-layer${p.cotton ? " on" : ""}"></div>
          <div class="bean-layer">${beans.join("")}</div>
        </div>
        <div class="pot-tag">${place} · ${p.beans ? colorWord(L) : "空杯"}</div>`;
      bindDrag(el, { kind: "pot", id: p.id });
      return el;
    }

    function nextPotState(p) {
      const n = Object.assign({}, p);
      if (n.beans > 0 && n.moisture > 0.25) {
        n.age += 1;
        n.dryStreak = 0;
        n.health = Math.min(1, n.health + 0.04);
      } else if (n.age > 0) {
        n.dryStreak += 1;
        n.health -= 0.2;
      }
      n.moisture = Math.max(0, n.moisture - (n.cotton ? 0.12 : 1.05));
      if (n.health < 0) n.health = 0;
      return n;
    }

    function tickDay() {
      state.pots = state.pots.map(nextPotState);
      state.day += 1;
    }

    function paintSprouts(t) {
      for (const p of state.pots) {
        if (!p._fromLook || !p._toLook) continue;
        const L = lerpLook(p._fromLook, p._toLook, t);
        const el = document.querySelector(`.pot[data-id="${p.id}"] .sprouts`);
        if (el) el.innerHTML = sproutSVG(L);
        const tag = document.querySelector(`.pot[data-id="${p.id}"] .pot-tag`);
        if (tag && t > 0.85) {
          const place = p.zone === "window" ? "窗邊" : p.zone === "dark" ? "黑暗" : "枱";
          tag.textContent = `${place} · ${p.beans ? colorWord(p._toLook) : "空杯"}`;
        }
        const water = document.querySelector(`.pot[data-id="${p.id}"] .water-layer`);
        if (water) {
          const m = lerp(p._fromLook.moisture, p._toLook.moisture, ease(t));
          water.style.height = Math.min(42, m * 14) + "%";
        }
      }
      paintDayCycle(t);
    }

    function paintDayCycle(t) {
      const sun = $("sun");
      const moon = $("moon");
      const sky = $("skyTint");
      const stars = $("stars");
      const rays = document.querySelector("#z-window .rays");
      const hour = $("clockHour");
      const minute = $("clockMinute");
      if (hour) hour.setAttribute("transform", `rotate(${t * 720} 50 50)`);
      if (minute) minute.setAttribute("transform", `rotate(${t * 8640} 50 50)`);

      let left = 12, top = 18, sunOp = 1, moonOp = 0, starOp = 0, skyColor = "transparent", rayOp = 0.7;
      if (t < 0.42) {
        const u = t / 0.42;
        left = 10 + u * 68;
        top = 26 - Math.sin(u * Math.PI) * 16;
        sunOp = 1;
        rayOp = 0.45 + 0.55 * Math.sin(u * Math.PI);
        skyColor = u < 0.55
          ? `rgba(255, 236, 150, ${0.06 + u * 0.12})`
          : `rgba(255, 140, 70, ${(u - 0.55) * 0.55})`;
      } else if (t < 0.54) {
        const u = (t - 0.42) / 0.12;
        left = 78 + u * 10;
        top = 26 + u * 16;
        sunOp = Math.max(0, 1 - u * 1.2);
        rayOp = (1 - u) * 0.4;
        moonOp = u * 0.55;
        starOp = u * 0.7;
        skyColor = `rgba(28, 22, 70, ${0.25 + u * 0.45})`;
      } else if (t < 0.76) {
        sunOp = 0;
        rayOp = 0;
        moonOp = 0.9;
        starOp = 0.95;
        skyColor = "rgba(10, 14, 42, 0.72)";
      } else {
        const u = (t - 0.76) / 0.24;
        left = 8 + u * 8;
        top = 32 - u * 14;
        sunOp = Math.min(1, u * 1.35);
        rayOp = u * 0.6;
        moonOp = 1 - u;
        starOp = 1 - u;
        skyColor = `rgba(255, 186, 120, ${(1 - u) * 0.28})`;
      }
      if (sun) {
        sun.style.left = left + "%";
        sun.style.top = top + "%";
        sun.style.right = "auto";
        sun.style.opacity = String(sunOp);
        sun.style.transform = "none";
      }
      if (moon) moon.style.opacity = String(moonOp);
      if (stars) stars.style.opacity = String(starOp);
      if (sky) sky.style.background = skyColor;
      if (rays) rays.style.opacity = String(rayOp);
    }

    function resetDayCycle() {
      const sun = $("sun");
      if (sun) {
        sun.style.left = "";
        sun.style.top = "";
        sun.style.right = "";
        sun.style.opacity = "";
        sun.style.transform = "";
      }
      if ($("moon")) $("moon").style.opacity = "";
      if ($("stars")) $("stars").style.opacity = "";
      if ($("skyTint")) $("skyTint").style.background = "";
      const rays = document.querySelector("#z-window .rays");
      if (rays) rays.style.opacity = "";
      if ($("clockHour")) $("clockHour").setAttribute("transform", "rotate(0 50 50)");
      if ($("clockMinute")) $("clockMinute").setAttribute("transform", "rotate(0 50 50)");
    }

    function findDrop(x, y) {
      const stack = document.elementsFromPoint(x, y);
      const pot = stack.find((n) => n.classList && n.classList.contains("pot"));
      const zone = stack.find((n) => n.dataset && n.dataset.zone);
      return { pot, zone };
    }

    let drag = null;
    const ghost = $("ghost");

    function bindDrag(el, info) {
      el.addEventListener("pointerdown", (e) => {
        if (state.passing) return;
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        drag = { ...info, x: e.clientX, y: e.clientY };
        ghost.style.display = "block";
        if (info.kind === "tool") {
          ghost.src = ICONS[info.tool];
          ghost.style.width = "72px";
        } else {
          ghost.src = ICONS.cup;
          ghost.style.width = "80px";
        }
        moveGhost(e.clientX, e.clientY);
        beep("pick");
      });
      el.addEventListener("pointermove", (e) => {
        if (!drag) return;
        moveGhost(e.clientX, e.clientY);
        const { pot, zone } = findDrop(e.clientX, e.clientY);
        document.querySelectorAll(".zone").forEach((z) => z.classList.toggle("hot", z === zone));
        document.querySelectorAll(".pot").forEach((p) => p.classList.toggle("hot", p === pot));
      });
      el.addEventListener("pointerup", (e) => endDrag(e));
      el.addEventListener("pointercancel", (e) => endDrag(e));
    }

    function moveGhost(x, y) {
      ghost.style.left = x + "px";
      ghost.style.top = y + "px";
    }

    function toast(msg) {
      $("hint").textContent = msg;
    }

    function endDrag(e) {
      if (!drag) return;
      const info = drag;
      drag = null;
      ghost.style.display = "none";
      document.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
      const { pot, zone } = findDrop(e.clientX, e.clientY);
      const potId = pot && pot.dataset.id;
      const target = potId ? state.pots.find((p) => String(p.id) === String(potId)) : null;

      if (info.kind === "tool") {
        if (info.tool === "cup") {
          if (!zone) { toast("請把器皿放到窗邊、黑暗處或工作枱。"); return; }
          if (state.pots.length >= MAX_POTS) { toast("已經有兩個盆栽。請一個放在窗邊，一個放在黑暗處。"); return; }
          state.pots.push({
            id: state.nextId++,
            zone: zone.dataset.zone,
            cotton: false,
            beans: 0,
            moisture: 0,
            age: 0,
            health: 1,
            dryStreak: 0
          });
          beep("drop");
        } else if (!target) {
          toast("請把物品放到盆栽上。");
        } else if (info.tool === "cotton") {
          target.cotton = true;
          beep("drop");
        } else if (info.tool === "beans") {
          target.beans = Math.min(5, target.beans + 3);
          beep("drop");
        } else if (info.tool === "water") {
          target.moisture = 3;
          target.dryStreak = 0;
          beep("water");
        }
      } else if (info.kind === "pot") {
        const moving = state.pots.find((p) => p.id === info.id);
        if (moving && zone) {
          moving.zone = zone.dataset.zone;
          beep("drop");
        }
      }
      render();
    }

    document.querySelectorAll(".tool").forEach((el) => {
      bindDrag(el, { kind: "tool", tool: el.dataset.tool });
    });

    ["klass", "stuno"].forEach((id) => {
      const el = $(id);
      if (el) el.addEventListener("input", refreshStart);
    });
    try {
      const saved = JSON.parse(localStorage.getItem("mungbean-who") || "null");
      if (saved && saved.class) $("klass").value = saved.class;
      if (saved && saved.no) $("stuno").value = saved.no;
    } catch (e) {}
    refreshStart();

    $("startBtn").onclick = () => {
      const id = identityOk();
      if (!id.ok) {
        alert("請填寫班別及學號。學號只須數字，無須填寫姓名。");
        return;
      }
      localStorage.setItem("mungbean-who", JSON.stringify(id));
      state.startedAt = Date.now();
      sendLog("開始", "開始");
      $("start").classList.add("hidden");
      $("game").classList.remove("hidden");
      render();
    };

    $("resetBtn").onclick = () => {
      if (state.passing) return;
      state.day = 0;
      state.pots = [];
      state.nextId = 1;
      render();
    };

    $("passDay").onclick = () => {
      if (state.passing || state.day >= MAX_DAY) return;
      const ready = state.pots.filter((p) => p.cotton && p.beans > 0 && p.moisture > 0.25);
      if (ready.length === 0) {
        toast("請先放入器皿、棉花、綠豆和水，再按「過一日」。");
        return;
      }
      state.passing = true;
      $("passDay").disabled = true;
      for (const p of state.pots) {
        p._fromLook = look(p);
        p._toLook = look(nextPotState(p));
      }
      render();
      paintSprouts(0);
      beep("day");
      const t0 = performance.now();
      function frame(now) {
        const p = Math.min(1, (now - t0) / DAY_MS);
        paintSprouts(p);
        if (p < 1) requestAnimationFrame(frame);
        else {
          tickDay();
          for (const pot of state.pots) {
            delete pot._fromLook;
            delete pot._toLook;
          }
          resetDayCycle();
          state.passing = false;
          render();
          if ([1, 2, 4, 9, 20].includes(state.day)) openLog();
        }
      }
      requestAnimationFrame(frame);
    };

    function leafWord(L) {
      if (L.stage < 4) return "未見真葉";
      if (L.wilt) return "葉垂低";
      if (L.light > 0.7) return L.age >= 7 ? "葉多、綠色" : "開始出葉";
      if (L.light < 0.2) return "葉少、發黃";
      return "葉片較少";
    }
    function rootWord(L) {
      if (L.stage < 2) return "未見根";
      if (L.wilt) return "根乾弱";
      if (L.light > 0.7) return "根較粗、向下";
      if (L.light < 0.2) return "根幼白";
      return "有白根";
    }
    function dirWord(p, L) {
      if (L.stage < 3) return "—";
      if (p.zone === "window") return "向着陽光";
      if (p.zone === "dark") return "沒有固定方向";
      return "向上";
    }

    function openLog() {
      const rows = state.pots.map((p) => {
        const L = look(p);
        const place = p.zone === "window" ? "窗邊（有陽光）" : p.zone === "dark" ? "黑暗" : "工作枱";
        return `<tr>
          <td>${place}</td>
          <td>${heightWord(L)}</td>
          <td>${leafWord(L)}</td>
          <td>${rootWord(L)}</td>
          <td>${dirWord(p, L)}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="5">未有盆栽</td></tr>`;

      const hasWin = state.pots.some((p) => p.zone === "window" && p.age >= 2);
      const hasDark = state.pots.some((p) => p.zone === "dark" && p.age >= 2);
      let conclude = "";
      if (state.day >= 2 && hasWin && hasDark) {
        conclude = `
          <p class="ok"><strong>求結果：</strong></p>
          <p>綠豆幼苗的生長方向和窗口／陽光方向<strong>相同</strong>。</p>
          <p>綠豆幼苗會<strong>向着</strong>陽光生長。</p>
          <p>所以綠豆幼苗<strong>會對光的方向做出反應</strong>。</p>`;
      } else if (state.day >= 2 && state.pots.every((p) => p.age === 0)) {
        conclude = `<p class="warn">綠豆尚未發芽。請檢查是否已放入棉花、綠豆和水。</p>`;
      } else if (state.day >= 2 && !(hasWin && hasDark)) {
        conclude = `<p class="warn">要比較光的方向，兩個盆栽都要有棉花、綠豆同水，而且一個窗邊、一個黑暗。</p>`;
      } else {
        conclude = `<p>請在冊上記錄第 1、4、9 日的莖高、葉和根。兩天後可以觀察生長方向。</p>`;
      }

      $("logSheet").innerHTML = `
        <h2>觀察紀錄　栽種的第 ${state.day} 天</h2>
        <table>
          <tr><th>位置</th><th>莖的高度</th><th>葉的數量</th><th>根的形態</th><th>生長方向</th></tr>
          ${rows}
        </table>
        ${conclude}
        <button class="primary" id="closeLog">繼續觀察</button>
        ${state.day >= 2 ? `<button class="primary gold" id="endLog">我發現了</button>` : ""}
        <button class="ghost-btn" id="backHome">返回說明</button>
      `;
      $("logModal").classList.add("show");
      $("closeLog").onclick = () => $("logModal").classList.remove("show");
      const end = $("endLog");
      if (end) end.onclick = () => {
        sendLog("完成", "完成");
        $("logSheet").innerHTML = `
          <h2>實驗結論</h2>
          <p>探究問題：綠豆幼苗會對光的方向做出反應嗎？</p>
          <p>窗邊（有陽光）的幼苗會<strong>向着陽光</strong>彎曲；黑暗處的幼苗又黃又細長，沒有固定方向。</p>
          <p class="ok">綠豆幼苗<strong>會</strong>對光的方向做出反應，向着陽光生長。</p>
          <p>發芽需要水和棉花保濕；健康生長還需要陽光。</p>
          <button class="primary" id="again">再種一次</button>
          <button class="ghost-btn" id="keep">返回實驗</button>
        `;
        $("again").onclick = () => { $("logModal").classList.remove("show"); $("resetBtn").click(); };
        $("keep").onclick = () => $("logModal").classList.remove("show");
      };
      $("backHome").onclick = () => {
        $("logModal").classList.remove("show");
        $("game").classList.add("hidden");
        $("start").classList.remove("hidden");
      };
    }

    $("logBtn").onclick = openLog;
    $("logModal").addEventListener("click", (e) => {
      if (e.target.id === "logModal") $("logModal").classList.remove("show");
    });

    document.addEventListener("touchmove", (e) => {
      if (drag) e.preventDefault();
    }, { passive: false });
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    if (QA) window.__qa = { state, tickDay, render, look };

    render();
  </script>
</body>
</html>
