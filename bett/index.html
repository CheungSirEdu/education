<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BETT SHOW" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BETT SHOW　英國遊學團　佛教志蓮小學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #2f7d32;
      --green-dark: #1b5e20;
      --yellow: #f4d35e;
      --card: #fffef6;
      --ink: #1d2b1f;
      --muted: #3d5c40;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body {
      margin: 0; min-height: 100%; min-height: 100dvh;
      font-family: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
      color: var(--ink);
      background: linear-gradient(#8fd3f0, #c8f0c0) fixed;
    }
    header {
      background: var(--green);
      color: #fff;
      text-align: center;
      padding: max(14px, env(safe-area-inset-top)) 16px 16px;
      box-shadow: 0 8px 0 var(--green-dark);
    }
    header .school { margin: 0; font-size: 15px; font-weight: 700; color: var(--yellow); }
    header h1 { margin: 6px 0 0; font-size: clamp(22px, 6vw, 28px); font-weight: 900; letter-spacing: .06em; }
    header p { margin: 8px 0 0; font-size: 18px; font-weight: 900; letter-spacing: .08em; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px calc(48px + env(safe-area-inset-bottom)); }
    .item {
      background: var(--card);
      border: 5px solid #c5dcc6;
      border-radius: 24px;
      padding: 16px 16px 14px;
      box-shadow: 0 6px 0 #8fbf92;
      margin-bottom: 14px;
    }
    .item h2 { margin: 0 0 4px; font-size: 22px; color: var(--green-dark); }
    .item p { margin: 0 0 12px; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.45; }
    .player {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }
    .player video {
      width: 100%;
      height: auto;
      display: block;
      vertical-align: middle;
    }
    .player.portrait video {
      max-height: min(72vh, 640px);
      object-fit: contain;
      background: #111;
    }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--green);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .04em;
      padding: 14px 16px;
      border-radius: 16px;
      box-shadow: 0 5px 0 var(--green-dark);
    }
    a.btn:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--green-dark); }
    #more { min-height: 8px; }
    footer {
      text-align: center; padding: 8px 16px 28px; color: var(--green-dark);
      font-size: 13px; font-weight: 700; line-height: 1.6;
    }
  
img.zhang-sir-mark {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  right: max(8px, env(safe-area-inset-right));
  width: 48px;
  height: 48px;
  z-index: 1000;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}
@media (min-width: 700px) {
  img.zhang-sir-mark { width: 56px; height: 56px; }
}
</style>
</head>
<body>
<img class="zhang-sir-mark" src="zhang-sir.png?v=gold" alt="張Sir" width="48" height="48">

  <header>
    <p class="school">佛教志蓮小學</p>
    <h1>BETT SHOW</h1>
    <p>英國遊學團</p>
  </header>
  <main class="wrap">
    <div class="item">
      <h2>綠惜小先鋒</h2>
      <p>課室分類，層層收集。</p>
      <div class="player">
        <video
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          poster="green-pioneers.jpg"
          title="綠惜小先鋒"
        >
          <source src="green-pioneers.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
    <div class="item">
      <h2>Cutebot 沿黑線轉彎</h2>
      <p>用黑膠紙貼線，小車會自己跟着走、自己轉彎。屋企可以咁玩。</p>
      <div class="player portrait">
        <video
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          poster="cutebot-line.jpg"
          title="Cutebot 沿黑線轉彎"
        >
          <source src="cutebot-line.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
    <div class="item">
      <h2>沿着黑色線</h2>
      <p>撳下面打開積木程式，下載到 micro:bit。</p>
      <a class="btn" href="https://makecode.microbit.org/_2xW4XVFDr0mu">打開積木程式</a>
    </div>
    <div id="more"></div>
  </main>
  <footer>
    佛教志蓮小學<br>
    本頁內容適合小學生閱讀。
  </footer>
</body>
</html>
